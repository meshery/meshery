# Ready-made Kubernetes manifest for the KubeCon workshop (Path B).
# Import this as a design in Meshery UI (Configuration > Designs > Import Design)
# or with:
#   mesheryctl design import -f kubecon-design.yaml -n kubecon-<your-handle>-design
# You may change the resource names and the app label to include your handle.
# The container image is the Meshery milestone Nginx image on Docker Hub.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecon-demo
  labels:
    app: kubecon-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubecon-demo
  template:
    metadata:
      labels:
        app: kubecon-demo
    spec:
      containers:
        - name: meshery-milestone
          image: meshery/meshery-milestone:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: kubecon-demo
spec:
  selector:
    app: kubecon-demo
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
