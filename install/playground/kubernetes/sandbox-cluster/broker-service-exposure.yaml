# Exposes the sandbox cluster's Meshery Broker (NATS) to the playground's Meshery Server.
#
# Target cluster: the SANDBOX cluster the playground manages (the cluster named in the
# kubeconfig held by ConfigMap `playground`), NOT the cluster the playground Pod runs in.
#
# Why: the playground's Meshery Server runs in a different cluster from the one it manages,
# so it cannot reach the Broker's ClusterIP. Current Meshery Server releases also skip the
# managed kube-API port-forward whenever the Server itself runs inside any Kubernetes
# cluster, so the Broker must be reachable directly. Access is restricted to the
# playground cluster's NAT egress address, and NATS still requires the token held in the
# operator-managed `meshery-nats-auth` Secret. The source-range allowlist is access
# control, not encryption: NATS traffic over this LoadBalancer is not TLS-encrypted,
# so keep the range as narrow as possible.
#
# Apply with ./apply.sh <sandbox-context> <playground egress IP>, which validates the
# address (the Broker CRD accepts any string here, including this unsubstituted
# placeholder) and uses server-side apply under a field manager of its own, so Meshery
# Server's controllers-configuration applies (field manager `meshery-server`) never
# withdraw it.
#
# The setting lives on the Broker custom resource, so it is lost whenever the
# meshery-operator Helm release is uninstalled. Re-apply it after any reinstall; see
# ../../readme.md, "Sandbox cluster: Meshery Operator, MeshSync and Broker".
apiVersion: meshery.io/v1alpha2
kind: Broker
metadata:
  name: meshery-broker
  namespace: meshery
spec:
  service:
    type: LoadBalancer
    loadBalancerSourceRanges:
      - ${PLAYGROUND_EGRESS_CIDR}
    annotations:
      # Classic OCI load balancer: the OKE cloud controller manages the security-list
      # rules from loadBalancerSourceRanges and removes them with the Service.
      service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
      service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
      service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
