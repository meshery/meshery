{{- $sa := required "meshsync.serviceAccount.name is required" .Values.meshsync.serviceAccount.name | toString }}
{{- if or (gt (len $sa) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $sa)) }}
{{- fail (printf "meshsync.serviceAccount.name %q is not a valid ServiceAccount name (DNS-1123 subdomain)" $sa) }}
{{- end }}
{{- if .Values.meshsync.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "meshery-operator.labels" . | nindent 4 }}
{{- end }}
---
# Read-only identity for MeshSync. Keep in step with MeshSync's API usage
# (meshery/meshsync) and with config/rbac in meshery/meshery-operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meshery-meshsync-role
  labels:
{{- include "meshery-operator.labels" . | nindent 4 }}
rules:
# Discovery. The watch-list is user-configurable (MeshSync spec.watch-list) and
# spans CRDs and cluster-scoped kinds, so list/watch cover every resource.
# get is deliberately not wildcarded: get on "*" also authorizes the connect
# subresources reached over GET (pods/exec, pods/attach and pods/portforward
# via WebSocket; pods/proxy, services/proxy, nodes/proxy), which run commands
# or proxy traffic rather than read state.
- apiGroups:
  - "*"
  resources:
  - "*"
  verbs:
  - list
  - watch
# Point reads: MeshSync's own custom resource (its watch-list, read at startup),
# the kube-system Namespace (cluster ID) and pod logs (on-request log streaming).
- apiGroups:
  - meshery.io
  resources:
  - meshsyncs
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - namespaces
  - pods/log
  verbs:
  - get
{{- with .Values.meshsync.rbac.extraRules }}
{{ toYaml . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meshery-meshsync-rolebinding
  labels:
{{- include "meshery-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meshery-meshsync-role
subjects:
- kind: ServiceAccount
  name: {{ $sa | quote }}
  namespace: {{ .Release.Namespace }}
{{- if not .Values.meshsync.serviceAccount.dedicated }}
---
# Until meshsync.serviceAccount.dedicated, the operator runs MeshSync under the
# literal ServiceAccount name meshery-operator: 1.0.6 and earlier hard-code it,
# and later releases default to it while MESHSYNC_SERVICE_ACCOUNT is unset.
# Read-only, same role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meshery-meshsync-compat-rolebinding
  labels:
{{- include "meshery-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meshery-meshsync-role
subjects:
- kind: ServiceAccount
  name: meshery-operator
  namespace: {{ .Release.Namespace }}
{{- end }}
