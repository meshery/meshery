version: "2"
run:
  timeout: 5m

linters:
  enable:
    - forbidigo
  settings:
    staticcheck:
      checks:
        - all
        - "-ST1000" # temporarily disabled.
        - "-ST1003" # temporarily disabled.
        - "-ST1005" # temporarily disabled.
        - "-ST1020" # temporarily disabled.
        - "-ST1021" # temporarily disabled.
        - "-ST1022" # temporarily disabled.
    forbidigo:
      forbid:
        - pattern: '^http\.Error$'
          msg: "Use writeMeshkitError(w, err, status) or writeJSONError(w, msg, status) from server/handlers/utils.go. http.Error writes Content-Type: text/plain and breaks RTK Query's default baseQuery. See docs/content/en/project/contributing/error-contract.md."
      exclude-godoc-examples: true
      analyze-types: true
  exclusions:
    paths:
      - server/handlers/doc.go
      - server/models/meshmodel/core/register.go
    rules:
      # Legitimate plain-text responders — keep http.Error here if used.
      - path: 'server/handlers/k8s_healthz_handler\.go'
        linters: [forbidigo]
      # UI handler serves static HTML; any http.Error there relates to
      # asset resolution, not API surface — keep off the hook.
      - path: 'server/handlers/ui_handler\.go'
        linters: [forbidigo]
      # SA5011 (possible nil pointer dereference) false-positives on the
      # common test shape `if got == nil { t.Fatal(...) }; got.Field` when it
      # appears inside a subtest closure: staticcheck does not model t.Fatal
      # there as terminating, so it cannot see the dereference is unreachable.
      # Scoped to _test.go files only — SA5011 stays enabled for non-test code
      # so genuine nil-deref findings are still reported.
      - path: '_test\.go'
        linters: [staticcheck]
        text: 'SA5011'
