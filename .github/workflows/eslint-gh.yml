name: eslint-check
on:
  pull_request:
    paths:
      - 'ui/**'
      - 'provider-ui/**'
jobs:
  eslint:
    name: runner / eslint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies in Meshery UI and Provider UI
      run: make ui-setup-ci
    - name: Run ESLint Meshery-UI
      run: make ui-lint-check
    - name: Run UI Kit Guardrail Lint
      run: make ui-kit-guardrail-lint

    - name: Run UI Guardrail Audits
      run: make ui-guardrail-audits

    - name: Publish UI Guardrail Audit Summary
      if: always()
      run: |
        {
          echo "## UI Guardrail Baseline Counts"
          echo
          echo '```'
          grep '^AUDIT mui ' ui/audit-mui.log || true
          grep '^AUDIT hex ' ui/audit-hex.log || true
          grep '^AUDIT size ' ui/audit-size.log || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Run ESLint Provider-UI
      run: make ui-provider-lint-check
