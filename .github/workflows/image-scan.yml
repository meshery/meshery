# Classification: Security scan (validation-only, read-only token sufficient for scan;
#   issues:write needed only to create/update vulnerability tracking issues).
# Trigger: push to master, pull_request (NOT pull_request_target — see security note below), manual.
#
# Security note: This workflow was previously triggered by pull_request_target, which
# runs forked-PR code with the base repo's GITHUB_TOKEN (write scope). Because the job
# executes `make docker-build` (arbitrary code from the PR), a malicious PR could exfiltrate
# secrets or mutate the repository. Switching to `pull_request` sandboxes forked PRs with
# a read-only token, eliminating this attack vector.
# Ref: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
name: Trivy Container Image Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
    paths-ignore:
      - "docs/**"
      - "mesheryctl/**"
      - "*.md"
      - "*.github/**"
      - "Makefile"
  push:
    branches:
      - "master"
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.github/**"

permissions:
  contents: read
  issues: write

jobs:
  build-and-scan:
    name: Build & Scan Container Image
    if: github.repository == 'meshery/meshery' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: make docker-build

      # Pin to v0.36.0 commit SHA for supply-chain safety.
      # trivy-action's master branch was compromised in March 2026 — never use @master.
      # Ref: https://github.com/aquasecurity/trivy-action/releases/tag/v0.36.0
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'meshery/meshery'
          format: 'json'
          output: 'trivy-scan-results.json'

      - name: Upload scan results
        if: ${{ always() && !cancelled() && hashFiles('trivy-scan-results.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: trivy-scan-results
          path: trivy-scan-results.json
          retention-days: 30

      - name: Parse Trivy Results
        id: parse_trivy
        run: |
          vuln_count=$(jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] 
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy-scan-results.json)
          echo "Found $vuln_count critical/high vulnerabilities" > issue_body.txt
          echo '```json' >> issue_body.txt
          jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] 
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")][0:5]' trivy-scan-results.json >> issue_body.txt
          echo '```' >> issue_body.txt
          echo "vuln_count=$vuln_count" >> $GITHUB_OUTPUT
          
      - name: Check for existing Trivy issue
        id: check_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_issue=$(gh issue list --label "security" --state open --limit 100 --json title,number | \
            jq -r '.[] | select(.title | contains("Trivy Scan")) | .number' | head -n 1)
          echo "existing_issue=$existing_issue" >> $GITHUB_OUTPUT

      - name: Create or update GitHub issue
        if: steps.parse_trivy.outputs.vuln_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${{ steps.check_issue.outputs.existing_issue }}" ]; then
            gh issue create \
              --title "Trivy Scan: CRITICAL/HIGH Vulnerabilities Found - $(date +'%Y-%m-%d %H:%M:%S')" \
              --body-file issue_body.txt \
              --label "security,auto-triaged"
          else
            gh issue comment ${{ steps.check_issue.outputs.existing_issue }} --body "$(cat issue_body.txt)"
          fi
