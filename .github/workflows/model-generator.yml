name: Model Component Generator and Updater
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: model-generator
  cancel-in-progress: false

jobs:
  generate-and-update-components:
    if: github.repository == 'meshery/meshery'
    name: Generate and Update Components
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build mesheryctl
        id: build-mesheryctl
        run: |
          cd mesheryctl
          make 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Generate Models and Components
        id: generate-models
        env:
          CRED: ${{ secrets.INTEGRATION_SPREADSHEET_CRED }}
        run: |
          cd mesheryctl
          ./mesheryctl registry generate \
            --spreadsheet-id "1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw" \
            --spreadsheet-cred "$CRED" \
            2>&1 | tee "$RUNNER_TEMP/generate.log"

      - name: Upload artifacts
        id: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generate-logs
          path: ~/.meshery/logs/

      - name: Check registry-generate-error file
        id: check-registry-generate-error
        run: |
          if [ -s ~/.meshery/logs/registry/registry-errors.log ]; then
            echo "registry-generate-error=true" >> $GITHUB_ENV
          else
            echo "registry-generate-error=false" >> $GITHUB_ENV
          fi

      - name: Run Model Updater
        id: update-models
        env:
          CRED: ${{ secrets.INTEGRATION_SPREADSHEET_CRED }}
        run: |
          cd mesheryctl
          ./mesheryctl registry update \
            -i ../models \
            --spreadsheet-id "1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw" \
            --spreadsheet-cred "$CRED" \
            2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: Pull changes from remote
        id: pull-pre-commit
        run: |
          git pull --rebase --autostash origin master 2>&1 | tee "$RUNNER_TEMP/pull-pre-commit.log"

      - name: Commit changes
        id: commit-changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: l5io
          commit_user_email: ci@meshery.io
          commit_options: "--signoff"
          commit_message: "Models generated and updated"
          branch: master

      - name: Prepare Failure Details
        if: failure()
        id: failure-details
        run: |
          FAILED_STAGE="an unidentified stage"
          CATEGORY="CI Infrastructure"
          LOG_FILE=""

          if [ "${{ steps.checkout.outcome }}" = "failure" ]; then
            FAILED_STAGE="Check out code"
          elif [ "${{ steps.setup-go.outcome }}" = "failure" ]; then
            FAILED_STAGE="Setup Go"
          elif [ "${{ steps.build-mesheryctl.outcome }}" = "failure" ]; then
            FAILED_STAGE="Build mesheryctl"
            CATEGORY="Meshery Build"
            LOG_FILE="$RUNNER_TEMP/build.log"
          elif [ "${{ steps.generate-models.outcome }}" = "failure" ]; then
            FAILED_STAGE="Generate Models and Components"
            CATEGORY="Model Generation"
            LOG_FILE="$RUNNER_TEMP/generate.log"
          elif [ "${{ steps.upload-artifacts.outcome }}" = "failure" ]; then
            FAILED_STAGE="Upload artifacts"
          elif [ "${{ steps.update-models.outcome }}" = "failure" ]; then
            FAILED_STAGE="Run Model Updater"
            CATEGORY="Model Generation"
            LOG_FILE="$RUNNER_TEMP/update.log"
          elif [ "${{ steps.pull-pre-commit.outcome }}" = "failure" ]; then
            FAILED_STAGE="Pre-commit git pull"
            CATEGORY="Git Synchronization"
            LOG_FILE="$RUNNER_TEMP/pull-pre-commit.log"
          elif [ "${{ steps.commit-changes.outcome }}" = "failure" ]; then
            FAILED_STAGE="Commit changes"
            CATEGORY="Git Commit"
          fi

          {
            echo "The Model Component Generator and Updater workflow failed at stage: ${FAILED_STAGE} [Category: ${CATEGORY}]."
            echo ""
            echo "Failed Run : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
            echo "Trigger    : ${{ github.event_name }}"
            echo ""
            if [ -n "$LOG_FILE" ] && [ -s "$LOG_FILE" ]; then
              echo "Raw Error Output (last 50 lines):"
              echo "--------------------------------------------------"
              tail -n 50 "$LOG_FILE" | tr -d '\r' | sed 's/\x1b\[[0-9;]*m//g'
              echo "--------------------------------------------------"
            else
              echo "No local command output captured for this stage. Please refer to the run link above for full step logs."
            fi
          } > "$RUNNER_TEMP/failure-email.txt"

          cat "$RUNNER_TEMP/failure-email.txt" >> "$GITHUB_STEP_SUMMARY"

          ATTACHMENT=""
          if [ -n "$LOG_FILE" ] && [ -s "$LOG_FILE" ]; then
            ATTACHMENT="$LOG_FILE"
          fi

          echo "stage=$FAILED_STAGE" >> "$GITHUB_OUTPUT"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "attachment=$ATTACHMENT" >> "$GITHUB_OUTPUT"

      - name: Send Email on Workflow Failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ github.repository }}] ${{ github.workflow }} — ${{ steps.failure-details.outputs.stage || 'unknown stage' }} failed (run #${{ github.run_number }})"
          from: |
            "Model Generator and Updater" <no-reply@meshery.io>
          to: developers@meshery.io
          body: file://${{ runner.temp }}/failure-email.txt
          attachments: ${{ steps.failure-details.outputs.attachment }}

      - name: Send Email on Registry Generate Error
        if: env.registry-generate-error == 'false' #Turn it back to true when we are good with all the errors.
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Model Generator Error Log
          from: |
            "Model Generator" <no-reply@meshery.io>
          to: developers@meshery.io
          body: |
               The Model Generator workflow (https://github.com/meshery/meshery/actions/workflows/model-generator.yml) encountered one or more errors. Refer to the attached error log for details or review the results of the failed workflow - https://github.com/meshery/meshery/actions/runs/${{ github.run_id }}.

               Learn more about the Meshery Registry - https://docs.meshery.io/concepts/logical/registry.
          attachments: ~/.meshery/logs/registry/registry-errors.log
