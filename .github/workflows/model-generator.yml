name: Model Component Generator and Updater
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: model-generator
  cancel-in-progress: false

jobs:
  generate-and-update-components:
    if: github.repository == 'meshery/meshery'
    name: Generate and Update Components
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build mesheryctl
        id: build-mesheryctl
        run: |
          cd mesheryctl
          make 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Generate Models and Components
        id: generate-models
        env:
          CRED: ${{ secrets.INTEGRATION_SPREADSHEET_CRED }}
        run: |
          cd mesheryctl
          ./mesheryctl registry generate \
            --spreadsheet-id "1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw" \
            --spreadsheet-cred "$CRED" \
            2>&1 | tee "$RUNNER_TEMP/generate.log"

      - name: Upload artifacts
        id: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generate-logs
          path: ~/.meshery/logs/

      - name: Check registry-generate-error file
        id: check-registry-generate-error
        run: |
          if [ -s ~/.meshery/logs/registry/registry-errors.log ]; then
            echo "registry-generate-error=true" >> $GITHUB_ENV
          else
            echo "registry-generate-error=false" >> $GITHUB_ENV
          fi

      - name: Run Model Updater
        id: update-models
        env:
          CRED: ${{ secrets.INTEGRATION_SPREADSHEET_CRED }}
        run: |
          cd mesheryctl
          ./mesheryctl registry update \
            -i ../models \
            --spreadsheet-id "1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw" \
            --spreadsheet-cred "$CRED" \
            2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: Pull changes from remote
        id: pull-pre-commit
        run: |
          git pull --rebase --autostash origin master 2>&1 | tee "$RUNNER_TEMP/pull-pre-commit.log"

      - name: Commit changes
        id: commit-changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: l5io
          commit_user_email: ci@meshery.io
          commit_options: "--signoff"
          commit_message: "Models generated and updated"
          branch: master

      - name: Prepare Failure Details
        if: failure()
        id: failure-details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
          JOB_URL=""
          if JOBS_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")"; then
            if ! JOB_URL="$(jq -er --arg job "Generate and Update Components" \
              '[.jobs[] | select(.name == $job) | .html_url][0] // empty' <<< "$JOBS_JSON")"; then
              echo "Could not find the current job URL in the workflow jobs response." >&2
              JOB_URL=""
            fi
          fi
          if [ -z "$JOB_URL" ]; then
            echo "Could not resolve the failed job URL; using the workflow run-attempt URL." >&2
            JOB_URL="$RUN_URL"
          fi

          FAILED_STAGES=()
          add_failed_stage() {
            if [ "$1" = "failure" ]; then
              FAILED_STAGES+=("$2|$3|$4")
            fi
          }

          add_failed_stage "${{ steps.checkout.outcome }}" "Check out code" "CI Infrastructure" ""
          add_failed_stage "${{ steps.setup-go.outcome }}" "Setup Go" "CI Infrastructure" ""
          add_failed_stage "${{ steps.build-mesheryctl.outcome }}" "Build mesheryctl" "Meshery Build" "$RUNNER_TEMP/build.log"
          add_failed_stage "${{ steps.generate-models.outcome }}" "Generate Models and Components" "Model Generation" "$RUNNER_TEMP/generate.log"
          add_failed_stage "${{ steps.upload-artifacts.outcome }}" "Upload artifacts" "CI Infrastructure" ""
          add_failed_stage "${{ steps.check-registry-generate-error.outcome }}" "Check registry-generate-error file" "Model Generation" ""
          add_failed_stage "${{ steps.update-models.outcome }}" "Run Model Updater" "Model Generation" "$RUNNER_TEMP/update.log"
          add_failed_stage "${{ steps.pull-pre-commit.outcome }}" "Pre-commit git pull" "Git Synchronization" "$RUNNER_TEMP/pull-pre-commit.log"
          add_failed_stage "${{ steps.commit-changes.outcome }}" "Commit changes" "Git Commit" ""

          {
            echo "The Model Component Generator and Updater workflow failed at the following stage(s):"
            echo ""
            if [ "${#FAILED_STAGES[@]}" -eq 0 ]; then
              echo "- An unidentified stage [Category: CI Infrastructure]"
            else
              for STAGE_DETAILS in "${FAILED_STAGES[@]}"; do
                IFS='|' read -r FAILED_STAGE CATEGORY LOG_FILE <<< "$STAGE_DETAILS"
                echo "- ${FAILED_STAGE} [Category: ${CATEGORY}]"
                if [ -n "$LOG_FILE" ] && [ -s "$LOG_FILE" ]; then
                  ERROR_LINES="$(sed 's/\x1b\[[0-9;]*m//g' "$LOG_FILE" | tr -d '\r' | grep -niE 'error|fail(ed|ure)?|fatal|panic|denied|timed out|could not|unable to|exit status' || true)"
                  if [ -n "$ERROR_LINES" ]; then
                    echo "Relevant error/failure lines (line numbers refer to the captured command log):"
                    echo "$ERROR_LINES"
                  else
                    echo "No matching error/failure lines found."
                  fi
                  echo "Last 50 lines for context:"
                  tail -n 50 "$LOG_FILE" | tr -d '\r' | sed 's/\x1b\[[0-9;]*m//g'
                else
                  echo "No local command output was captured for this stage; see the job log."
                fi
                echo ""
              done
            fi
            echo "Failed job  : ${JOB_URL}"
            echo "Failed run  : ${RUN_URL}"
            echo "Trigger    : ${{ github.event_name }}"
          } > "$RUNNER_TEMP/failure-email.txt"

          cat "$RUNNER_TEMP/failure-email.txt" >> "$GITHUB_STEP_SUMMARY"

          ATTACHMENT=""
          for STAGE_DETAILS in "${FAILED_STAGES[@]}"; do
            IFS='|' read -r _ _ LOG_FILE <<< "$STAGE_DETAILS"
            if [ -n "$LOG_FILE" ] && [ -s "$LOG_FILE" ]; then
              ATTACHMENT="${ATTACHMENT}${ATTACHMENT:+,}${LOG_FILE}"
            fi
          done

          FAILED_STAGE="${FAILED_STAGES[0]%%|*}"
          echo "stage=${FAILED_STAGE:-unknown stage}" >> "$GITHUB_OUTPUT"
          echo "attachment=$ATTACHMENT" >> "$GITHUB_OUTPUT"

      - name: Send Email on Workflow Failure
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ github.repository }}] ${{ github.workflow }} — ${{ steps.failure-details.outputs.stage || 'unknown stage' }} failed (run #${{ github.run_number }})"
          from: |
            "Model Generator and Updater" <no-reply@meshery.io>
          to: maintainers@meshery.io
          body: file://${{ runner.temp }}/failure-email.txt
          attachments: ${{ steps.failure-details.outputs.attachment }}

      - name: Send Email on Registry Generate Error
        if: env.registry-generate-error == 'false' #Turn it back to true when we are good with all the errors.
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Model Generator Error Log
          from: |
            "Model Generator" <no-reply@meshery.io>
          to: developers@meshery.io
          body: |
               The Model Generator workflow (https://github.com/meshery/meshery/actions/workflows/model-generator.yml) encountered one or more errors. Refer to the attached error log for details or review the results of the failed workflow - https://github.com/meshery/meshery/actions/runs/${{ github.run_id }}.

               Learn more about the Meshery Registry - https://docs.meshery.io/concepts/logical/registry.
          attachments: ~/.meshery/logs/registry/registry-errors.log
