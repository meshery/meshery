name: Model Component Generator and Updater
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

concurrency:
  group: model-generator
  cancel-in-progress: false

jobs:
  generate-and-update-components:
    if: github.repository == 'meshery/meshery'
    name: Generate and Update Components
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build mesheryctl
        id: build-mesheryctl
        run: |
          cd mesheryctl
          make 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Generate Models and Components
        id: generate-models
        env:
          CRED: ${{ secrets.INTEGRATION_SPREADSHEET_CRED }}
        run: |
          cd mesheryctl
          ./mesheryctl registry generate \
            --spreadsheet-id "1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw" \
            --spreadsheet-cred "$CRED" \
            2>&1 | tee "$RUNNER_TEMP/generate.log"

      - name: Upload artifacts
        id: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generate-logs
          path: ~/.meshery/logs/

      - name: Check registry-generate-error file
        id: check-registry-generate-error
        run: |
          if [ -s ~/.meshery/logs/registry/registry-errors.log ]; then
            echo "registry-generate-error=true" >> $GITHUB_ENV
          else
            echo "registry-generate-error=false" >> $GITHUB_ENV
          fi

      - name: Run Model Updater
        id: update-models
        env:
          CRED: ${{ secrets.INTEGRATION_SPREADSHEET_CRED }}
        run: |
          cd mesheryctl
          ./mesheryctl registry update \
            -i ../models \
            --spreadsheet-id "1DZHnzxYWOlJ69Oguz4LkRVTFM79kC2tuvdwizOJmeMw" \
            --spreadsheet-cred "$CRED" \
            2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: Pull changes from remote
        id: pull-pre-commit
        run: |
          git pull --rebase --autostash origin master 2>&1 | tee "$RUNNER_TEMP/pull-pre-commit.log"

      - name: Commit changes
        id: commit-changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: l5io
          commit_user_email: ci@meshery.io
          commit_options: "--signoff"
          commit_message: "Models generated and updated"
          branch: master

      - name: Send Email on Registry Generate Error
        if: env.registry-generate-error == 'false' #Turn it back to true when we are good with all the errors.
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Model Generator Error Log
          from: |
            "Model Generator" <no-reply@meshery.io>
          to: developers@meshery.io
          body: |
               The Model Generator workflow (https://github.com/meshery/meshery/actions/workflows/model-generator.yml) encountered one or more errors. Refer to the attached error log for details or review the results of the failed workflow - https://github.com/meshery/meshery/actions/runs/${{ github.run_id }}.

               Learn more about the Meshery Registry - https://docs.meshery.io/concepts/logical/registry.
          attachments: ~/.meshery/logs/registry/registry-errors.log

  failure-notification:
    name: Notify on Model Generator failure
    needs: generate-and-update-components
    if: ${{ always() && needs.generate-and-update-components.result == 'failure' && github.repository == 'meshery/meshery' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch failed-step logs and prepare email
        id: failure-details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"
          EMAIL_FILE="$RUNNER_TEMP/failure-email.txt"
          LOG_DIR="$RUNNER_TEMP/failed-step-logs"
          JOB_URL=""
          JOB_ID=""
          FAILED_STAGE=""
          FAILED_STEPS_JSON="[]"
          ATTACHMENTS=""
          API_ERROR=""
          LOG_DOWNLOAD_FAILED=false
          MAX_JOB_LOG_SIZE_BYTES=$((10 * 1024 * 1024))

          {
            echo "The Model Component Generator and Updater workflow failed."
            echo "Trigger    : ${{ github.event_name }}"
            echo "Failed run : ${RUN_URL}"
          } > "$EMAIL_FILE"

          append_log_excerpt() {
            local LOG_FILE="$1"
            local LOG_LABEL="$2"
            local NORMALIZED_LOG="${LOG_FILE}.normalized"
            local EXCERPT_FILE="${LOG_FILE}.excerpt"
            local START_LINE_COUNT CURRENT_LINE_COUNT LINES_USED REMAINING_LINES TAIL_LINES GREP_STATUS
            local MATCH_LINE_COUNT MATCH_LINE_LIMIT MAX_EXCERPT_LINES=100 MAX_TAIL_LINES=50
            # Include the trailing-context heading and blank line in the reservation.
            local TAIL_RESERVE_LINES=$((MAX_TAIL_LINES + 2))
            START_LINE_COUNT="$(wc -l < "$EMAIL_FILE")"

            if ! sed 's/\x1b\[[0-9;]*m//g' "$LOG_FILE" | tr -d '\r' > "$NORMALIZED_LOG"; then
              echo "Could not normalize the ${LOG_LABEL}; the complete log is attached." >> "$EMAIL_FILE"
              return 0
            fi

            echo "Log excerpt for ${LOG_LABEL}:" >> "$EMAIL_FILE"
            if grep -niE -C 3 \
              'error|fail(ed|ure)?|fatal|panic|denied|timed out|could not|unable to|exit status|cannot|not found|killed|unexpected|invalid|refused' \
              "$NORMALIZED_LOG" > "$EXCERPT_FILE"; then
              echo "Relevant error/failure lines with surrounding context:" >> "$EMAIL_FILE"
              CURRENT_LINE_COUNT="$(wc -l < "$EMAIL_FILE")"
              LINES_USED=$((CURRENT_LINE_COUNT - START_LINE_COUNT))
              REMAINING_LINES=$((MAX_EXCERPT_LINES - LINES_USED))
              MATCH_LINE_COUNT="$(wc -l < "$EXCERPT_FILE")"
              MATCH_LINE_LIMIT="$REMAINING_LINES"
              if [ "$REMAINING_LINES" -gt "$TAIL_RESERVE_LINES" ] &&
                [ "$MATCH_LINE_COUNT" -gt "$((REMAINING_LINES - TAIL_RESERVE_LINES))" ]; then
                MATCH_LINE_LIMIT=$((REMAINING_LINES - TAIL_RESERVE_LINES))
              fi
              if [ "$MATCH_LINE_LIMIT" -gt 0 ]; then
                head -n "$MATCH_LINE_LIMIT" "$EXCERPT_FILE" >> "$EMAIL_FILE"
              fi
            else
              GREP_STATUS=$?
              if [ "$GREP_STATUS" -eq 1 ]; then
                echo "No matching error/failure lines found in this log." >> "$EMAIL_FILE"
              else
                echo "Could not search this log for error/failure lines (grep exit ${GREP_STATUS})." >> "$EMAIL_FILE"
              fi
            fi

            CURRENT_LINE_COUNT="$(wc -l < "$EMAIL_FILE")"
            LINES_USED=$((CURRENT_LINE_COUNT - START_LINE_COUNT))
            REMAINING_LINES=$((MAX_EXCERPT_LINES - LINES_USED))
            if [ "$REMAINING_LINES" -gt 2 ]; then
              echo "Additional context from the end of the log:" >> "$EMAIL_FILE"
              CURRENT_LINE_COUNT="$(wc -l < "$EMAIL_FILE")"
              LINES_USED=$((CURRENT_LINE_COUNT - START_LINE_COUNT))
              REMAINING_LINES=$((MAX_EXCERPT_LINES - LINES_USED))
              TAIL_LINES=$((REMAINING_LINES - 1))
              if [ "$TAIL_LINES" -gt "$MAX_TAIL_LINES" ]; then
                TAIL_LINES="$MAX_TAIL_LINES"
              fi
              if [ "$TAIL_LINES" -gt 0 ]; then
                if tail -n "$TAIL_LINES" "$NORMALIZED_LOG" > "${EXCERPT_FILE}.tail"; then
                  cat "${EXCERPT_FILE}.tail" >> "$EMAIL_FILE"
                else
                  echo "Could not read the last lines of this log." >> "$EMAIL_FILE"
                fi
              fi
              echo "" >> "$EMAIL_FILE"
            fi
          }

          if ! mkdir -p "$LOG_DIR"; then
            echo "Could not create the temporary log directory: $LOG_DIR" >> "$EMAIL_FILE"
          elif ! JOBS_JSON="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")"; then
            API_ERROR="Could not list jobs for this workflow run attempt."
          elif ! JOB_JSON="$(jq -ce --arg job "Generate and Update Components" \
            '[.jobs[] | select(.name == $job)][0] // empty' <<< "$JOBS_JSON")"; then
            API_ERROR="Could not find the Model Generator job in the workflow jobs response."
          elif ! JOB_ID="$(jq -er '.id' <<< "$JOB_JSON")"; then
            API_ERROR="The Model Generator job response did not contain a job ID."
          else
            JOB_URL="$(jq -r '.html_url // empty' <<< "$JOB_JSON")"

            if ! FAILED_STEPS_JSON="$(jq -c \
              '[.steps[]? | select(.conclusion == "failure" or .conclusion == "timed_out")]' \
              <<< "$JOB_JSON")"; then
              API_ERROR="Could not read failed steps from the Model Generator job response."
            fi
          fi

          {
            if [ -n "$JOB_URL" ]; then
              echo "Failed job : ${JOB_URL}"
            else
              echo "Failed job URL unavailable; workflow run: ${RUN_URL}"
            fi
            if [ -n "$API_ERROR" ]; then
              echo ""
              echo "Log retrieval issue: ${API_ERROR}"
            fi
            echo ""
          } >> "$EMAIL_FILE"

          if [ -n "$JOB_ID" ]; then
            FAILED_STEP_COUNT="$(jq 'length' <<< "$FAILED_STEPS_JSON")"
            if [ "$FAILED_STEP_COUNT" -eq 0 ]; then
              echo "The API reported no failed step records; attempting to attach the complete job log." >> "$EMAIL_FILE"
            else
              FAILED_STAGE="$(jq -r '.[0].name // empty' <<< "$FAILED_STEPS_JSON")"
              while IFS= read -r STEP_JSON; do
                STEP_NUMBER="$(jq -r '.number' <<< "$STEP_JSON")"
                STEP_NAME="$(jq -r '.name // "Unknown failed step"' <<< "$STEP_JSON")"
                STEP_LOG="$LOG_DIR/failed-step-${STEP_NUMBER}.log"
                DOWNLOAD_TEMP="${STEP_LOG}.download"

                {
                  echo "Failed step: ${STEP_NAME} (step ${STEP_NUMBER})"
                  if [ -n "$JOB_URL" ]; then
                    echo "Failed step link: ${JOB_URL}#step:${STEP_NUMBER}:1"
                  else
                    echo "Failed step link unavailable; use the workflow run link: ${RUN_URL}"
                  fi
                } >> "$EMAIL_FILE"

                if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 120 \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/steps/$STEP_NUMBER/logs" \
                  --output "$DOWNLOAD_TEMP" && [ -s "$DOWNLOAD_TEMP" ] && mv "$DOWNLOAD_TEMP" "$STEP_LOG"; then
                  ATTACHMENTS="${ATTACHMENTS}${ATTACHMENTS:+,}${STEP_LOG}"
                  append_log_excerpt "$STEP_LOG" "${STEP_NAME} (step ${STEP_NUMBER})"
                else
                  rm -f "$DOWNLOAD_TEMP"
                  LOG_DOWNLOAD_FAILED=true
                  echo "Could not download the complete log for this failed step; see the job link above." >> "$EMAIL_FILE"
                fi

                echo "" >> "$EMAIL_FILE"
              done <<< "$(jq -c '.[]' <<< "$FAILED_STEPS_JSON")"
            fi

            if [ "$FAILED_STEP_COUNT" -eq 0 ] || [ "$LOG_DOWNLOAD_FAILED" = true ]; then
              JOB_LOG="$LOG_DIR/job-${JOB_ID}.log"
              JOB_LOG_TEMP="${JOB_LOG}.download"
              if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 120 \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" \
                --output "$JOB_LOG_TEMP" && [ -s "$JOB_LOG_TEMP" ] && mv "$JOB_LOG_TEMP" "$JOB_LOG"; then
                if JOB_LOG_SIZE_BYTES="$(stat -c%s "$JOB_LOG")" && [[ "$JOB_LOG_SIZE_BYTES" =~ ^[0-9]+$ ]]; then
                  if [ "$JOB_LOG_SIZE_BYTES" -le "$MAX_JOB_LOG_SIZE_BYTES" ]; then
                    ATTACHMENTS="${ATTACHMENTS}${ATTACHMENTS:+,}${JOB_LOG}"
                    echo "Complete job log attached as a fallback (${JOB_LOG_SIZE_BYTES} bytes)." >> "$EMAIL_FILE"
                  else
                    echo "Complete job log was not attached because it is ${JOB_LOG_SIZE_BYTES} bytes, exceeding the 10 MiB attachment limit. The job/run link above remains available." >> "$EMAIL_FILE"
                  fi
                else
                  echo "Complete job log was not attached because its size could not be determined. The job/run link above remains available." >> "$EMAIL_FILE"
                fi
                append_log_excerpt "$JOB_LOG" "complete job log fallback"
              else
                rm -f "$JOB_LOG_TEMP"
                echo "Could not download the complete job log fallback; use the job link above." >> "$EMAIL_FILE"
              fi
            fi
          fi

          if [ -z "$JOB_ID" ]; then
            echo "No failed-step logs could be downloaded; use the run link above." >> "$EMAIL_FILE"
          fi

          echo "stage=${FAILED_STAGE:-unknown stage}" >> "$GITHUB_OUTPUT"
          echo "attachments=$ATTACHMENTS" >> "$GITHUB_OUTPUT"

      - name: Send Email on Workflow Failure
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ github.repository }}] ${{ github.workflow }} — ${{ steps.failure-details.outputs.stage || 'unknown stage' }} failed (run #${{ github.run_number }})"
          from: |
            "Model Generator and Updater" <no-reply@meshery.io>
          to: maintainers@meshery.io
          body: file://${{ runner.temp }}/failure-email.txt
          attachments: ${{ steps.failure-details.outputs.attachments }}
