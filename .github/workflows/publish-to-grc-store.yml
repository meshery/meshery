name: "Publish OSPS Baseline results to grc.store"

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run scan without publishing to grc.store (bundles land in workflow artifacts)"
        type: boolean
        default: false
  schedule:
    # Run once a week (Mondays at 6:00 UTC)
    - cron: "0 6 * * 1"
  push:
    branches:
      - master
    tags:
      - "v*"
  release:
    types: [published]

permissions: {}

jobs:
  version:
    name: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve target version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="${{ github.ref_name }}"
          else
            # Fall back to latest published release tag for branch/scheduled runs
            raw_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo "v0.7.0")
          fi
          echo "version=${raw_tag#v}" >> "$GITHUB_OUTPUT"

  results:
    name: publish-results
    needs: version
    permissions:
      contents: read         
      id-token: write        
      security-events: write 
    # Pinned to the immutable tag @v1 as mandated by grc.store
    uses: revanite-io/pvtr-publish-results/.github/workflows/publish.yml@v1
    with:
      target: meshery/meshery@${{ needs.version.outputs.version }}
      license: CC0-1.0
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      config: |
        targets:
          meshery:
            plugin: openssf/github-repo
            policy:
              catalogs:
                - osps-baseline
              applicability:
                - maturity-1
            vars:
              owner: meshery
              repo: meshery
              token: ${{ secrets.GITHUB_TOKEN }}
