name: GraphQL API Documentation
on:
  push:
    branches:
      - "master"
    paths:
      - "server/internal/graphql/schema/schema.graphql"

permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    if: github.repository == 'meshery/meshery'
    steps:
      - name: Checkout repo 🛎️
        uses: actions/checkout@master
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Check GraphQL docs tooling
        id: graphql_docs
        run: |
          if [[ -f docs/Gemfile && -f docs/Rakefile ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "GraphQL docs generator files are not present; skipping docs regeneration."
          fi

      - name: Set up Ruby
        if: steps.graphql_docs.outputs.available == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7.5
          bundler-cache: true

      - name: graphql-docs
        if: steps.graphql_docs.outputs.available == 'true'
        run: make graphql-docs-build

      - name: Pull changes from remote
        if: steps.graphql_docs.outputs.available == 'true'
        run: git pull origin master

      - name: Commit changes
        if: steps.graphql_docs.outputs.available == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: docs/
          commit_user_name: l5io
          commit_user_email: ci@meshery.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "[Docs] Generated documentation for GraphQL API"
          branch: master
