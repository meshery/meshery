name: "Pull Request Labeler"

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited
      - ready_for_review
      - converted_to_draft
    branches:
      - master

permissions: {}

jobs:
  triage:
    name: Triage (Labeler)
    if: contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

  suggest-reviews:
    name: PR Review Suggestions
    needs: [triage]
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: |
      always() &&
      (needs.triage.result == 'success' || needs.triage.result == 'skipped') &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted base repository scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .github/scripts/pr-review-suggestions.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Suggest Related Pull Requests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { run } = require('./.github/scripts/pr-review-suggestions.js');
            await run({ github, context, core });
