name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} no-mistakes gate - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

# Not a reusable workflow. Other repositories must not `uses:` this file.
# A pull request is exempt only when every changed path is documentation,
# the docs website, or CI. Classification runs inside the job (not as an
# on.pull_request path filter) so the required check still reports success
# on exempt pull requests. Any other path must carry a green no-mistakes
# run bound to the current head.
# See docs/content/en/project/contributing/build-and-release.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-24.04
    steps:
      # Sparse-checkout the classifier only. The logic lives in the repository
      # so it can be unit-tested. Like the workflow file itself, the script
      # comes from this pull_request event's revision.
      - name: Check out exemption classifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/no_mistakes_exemption.py
            .github/scripts/no_mistakes_exemption_test.py
          sparse-checkout-cone-mode: false

      # Run tests in this same required job. A separate job that this job
      # `needs` would skip this check when the tests fail, and branch
      # protection treats a skipped required check as passing.
      - name: Run classifier unit tests
        working-directory: .github/scripts
        run: python3 -m unittest no_mistakes_exemption_test.py -v

      - name: Classify documentation, website, and CI pull requests
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          changed=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.changed_files')
          files=$(mktemp)
          gh api --paginate "/repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[] | {filename, previous_filename}' > "$files"
          CHANGED_FILES="$changed" FILES_JSON="$files" python3 .github/scripts/no_mistakes_exemption.py

      - name: Verify no-mistakes signature and pipeline attestation
        if: steps.scope.outputs.exempt != 'true'
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@5732d1ed88a1572fa6115d6ede5d69bfec097946 # v1.106.1
