name: E2E Report on Pull Request Comment
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run ID from the Meshery UI and Server workflow
        required: true
        type: string
      debug_mode:
        description: Enable debug logging
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ['Meshery UI and Server']
    types: [completed]

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  e2e-test-reporter:
    if: >
      github.repository == 'meshery/meshery' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_target')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: 🔍 Introspect workflow context
        run: |
          echo "::group::Workflow Context"
          echo "Event Name: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Debug Mode: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_mode || 'false' }}"
          echo "Source Run ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}"
          echo "Source Event: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || 'workflow_dispatch' }}"
          echo "::endgroup::"

      - name: Download e2e test report artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: e2e-test-reporter
          path: e2e-test-reporter
          github-token: ${{ secrets.MESHERY_CI }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}

      - name: Determine PR metadata availability
        id: metadata
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs')
            const prNumberPath = './e2e-test-reporter/pr/number'
            const prShaPath = './e2e-test-reporter/pr/sha'
            const reportPath = './e2e-test-reporter/ui/test-report.md'

            // The upstream workflow only writes PR metadata for pull_request_target runs.
            // When the source workflow is a push on master after merge, the artifact still
            // contains the test report but does not include ./pr metadata. Skip cleanly.
            const hasPRMetadata = fs.existsSync(prNumberPath) && fs.existsSync(prShaPath)
            core.setOutput('has-pr-metadata', hasPRMetadata ? 'true' : 'false')

            if (!fs.existsSync(reportPath)) {
              core.setFailed(`Expected test report at ${reportPath}, but it was not found.`)
              return
            }

            if (!hasPRMetadata) {
              core.notice('Skipping PR comment because the source run no longer has PR metadata. This commonly happens after the PR has already been merged and the upstream workflow ran on master.')
              return
            }

            core.setOutput('pr-number', fs.readFileSync(prNumberPath, 'utf8').trim())
            core.setOutput('pr-sha', fs.readFileSync(prShaPath, 'utf8').trim())
            core.setOutput('report-path', reportPath)

      - name: Find Comment
        if: steps.metadata.outputs.has-pr-metadata == 'true'
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: fc
        with:
          issue-number: ${{ steps.metadata.outputs.pr-number }}
          comment-author: 'github-actions[bot]'
          body-includes: END-TO-END TESTS

      - name: Delete Previous Comment
        if: steps.metadata.outputs.has-pr-metadata == 'true' && steps.fc.outputs.comment-id != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.deleteComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ steps.fc.outputs.comment-id }}
            })

      - name: Comment on PR with E2E results
        if: ${{ !cancelled() && steps.metadata.outputs.has-pr-metadata == 'true' }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs')
            const PRNumber = Number('${{ steps.metadata.outputs.pr-number }}')
            const PRSha = '${{ steps.metadata.outputs.pr-sha }}'
            const E2ETestReporter = fs.readFileSync('${{ steps.metadata.outputs.report-path }}', 'utf8')

            // Keep a single PR comment updated with the latest E2E status so reviewers do not
            // need to hunt through multiple comments for the current report.
            const body = `
              **Commit SHA:** \`${PRSha}\`

              ${E2ETestReporter}
              `

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: PRNumber,
              body: body
            })

  notify-on-failure:
    needs:
      - e2e-test-reporter
    if: ${{ always() && needs.e2e-test-reporter.result == 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Send email notification on failure
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: E2E PR reporter failed - ${{ github.workflow }}
          to: maintainers@meshery.io
          from: Meshery E2E PR reporter workflow
          body: |
            The E2E PR reporter workflow failed.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}
            Trigger Event: ${{ github.event_name }}

            Review the logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
