name: E2E Tests 

on:
  workflow_call:
    inputs:
      meshery-image:
        description: 'Name of the Docker image artifact to download'
        required: true
        type: string
    
    outputs:
      test-report-artifact:
        value: ${{ jobs.test-e2e.outputs.test-report-artifact }}
      allure-results-artifact:
        value: ${{ jobs.test-e2e.outputs.allure-results-artifact }}
      playwright-traces-artifact:
        value: ${{ jobs.test-e2e.outputs.playwright-traces-artifact }}
      playwright-report-artifact:
        value: ${{ jobs.test-e2e.outputs.playwright-report-artifact }}
    
    secrets:
      # Named for the organization secret it is fed from, deliberately. This
      # input used to be called REMOTE_PROVIDER_TOKEN and the caller filled it
      # from `secrets.REMOTE_PROVIDER_TOKEN` - a secret that exists on neither
      # meshery/meshery nor the meshery org. The alias is what let the typo
      # survive: a missing secret expands to the empty string, so the wiring
      # looked deliberate and read as correct in review. One name end to end
      # means the next reader can grep it against the real secret list.
      #
      # `required: true` was considered - it would reject a caller that drops
      # the secret from its `secrets:` block - and deliberately rejected. The
      # documentation for `on.workflow_call.secrets.<secret_id>.required` says
      # only that the secret must be supplied and does not say how an empty
      # value is treated. Every fork and Dependabot run resolves this secret to
      # the empty string, so if that counts as "not supplied" the whole job
      # aborts at workflow-call time for outside contributors - including the
      # Local provider tests, which need no credential - and nothing before a
      # merge can tell us which way it goes. The pre-flight step below already
      # reports the missing-value case with a message naming all three ways it
      # can happen.
      REMOTE_PROVIDER_TEST_USER_TOKEN:
        description: 'Session token for the dedicated remote-provider CI test user (org secret REMOTE_PROVIDER_TEST_USER_TOKEN)'
        required: false

permissions:
  contents: read

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04

    outputs:
      test-report-artifact: e2e-test-report
      allure-results-artifact: allure-results
      playwright-traces-artifact: playwright-traces
      playwright-report-artifact: playwright-report
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          
      # Before Kind, Docker and the browser download, so a credential
      # misconfiguration costs seconds rather than the whole job.
      #
      # A missing secret expands to the empty string, never an error, so a check
      # like this one is the only thing separating "wired to the wrong secret
      # name" from "wired correctly". Without it the remote-provider project
      # authenticated against nothing from 2026-05-18 until 2026-08-05, and the
      # first symptom anyone saw was a Playwright error ("Email is required for
      # login") that reads like a broken test rather than absent CI config.
      #
      # Only `push` selects chromium-meshery-provider (npm test:e2e:ci:full);
      # pull_request runs test:e2e:ci:local, which never touches the remote
      # provider, so a missing token there is nothing to fail on. That is also
      # why fork PRs - which cannot read secrets at all - are unaffected.
      #
      # It still reports on pull_request rather than being skipped there,
      # because a PR that changes this wiring has no other way to show that the
      # secret name resolves: the project it feeds does not run until the change
      # is already on master. That reporting is only worth anything if it
      # distinguishes the cases. A fork PR reads no secrets at all, and a
      # Dependabot run reads a *separate* Dependabot secrets store rather than
      # this repository's Actions secrets - so an empty value in either case
      # says nothing about whether the secret resolves. Every other same-
      # repository PR does read them, so an empty value there means the secret
      # itself stopped resolving - the exact silent-empty-string failure this
      # step exists to surface. Calling them all "expected" would hide that
      # behind the benign cases until the next push to master; calling them all
      # a misconfiguration would cry wolf on every fork and Dependabot PR.
      - name: Verify remote-provider credentials are available
        env:
          REMOTE_PROVIDER_TEST_USER_TOKEN: ${{ secrets.REMOTE_PROVIDER_TEST_USER_TOKEN }}
          REMOTE_PROVIDER_URL: "https://cloud.meshery.io"
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$REMOTE_PROVIDER_TEST_USER_TOKEN" ]; then
            echo "Remote-provider credentials present (REMOTE_PROVIDER_TEST_USER_TOKEN resolved)."
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            echo "::error::REMOTE_PROVIDER_TEST_USER_TOKEN is empty. The chromium-meshery-provider project cannot authenticate against ${REMOTE_PROVIDER_URL}, and every test in it would then fail on a missing storage state. Three things can leave it empty: the org secret does not exist, the org secret is not exposed to this repository, or the calling workflow does not pass it in its 'secrets:' block (.github/workflows/build-and-test.yml) - the last is what broke this before."
            exit 1
          fi
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::notice::REMOTE_PROVIDER_TEST_USER_TOKEN is empty. Expected on a pull request from the fork ${HEAD_REPO}, which cannot read secrets. This build runs the Local provider only, so nothing here needs it."
            exit 0
          fi
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::notice::REMOTE_PROVIDER_TEST_USER_TOKEN is empty. Expected on a Dependabot run, which reads the separate Dependabot secrets store rather than this repository's Actions secrets. This build runs the Local provider only, so nothing here needs it."
            exit 0
          fi
          echo "::warning::REMOTE_PROVIDER_TEST_USER_TOKEN did not resolve on a ${EVENT_NAME} build of ${BASE_REPO}, which can read this repository's secrets. This is not expected: the org secret has most likely been renamed, deleted, or dropped from this repository's exposure. The next push to master will fail this job at this step, and chromium-meshery-provider will not authenticate until the secret is restored. Not blocking here, because this build runs the Local provider only."

      - name: Check out code
        uses: actions/checkout@v6

      - name: Setup Kubernetes (Kind)
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: "kind-cluster"
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
    
      - name: Download Meshery Artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.meshery-image }}
          path: .

      - name: Load Docker Image
        run: |
          docker load -i meshery.tar
  
      - name: Run Meshery UI and Server
        run: |
          docker run -d \
            -p 9081:8080 \
            --name meshery \
            meshery-server:ci

      - name: Install Playwright
        run: make ui-setup-ci

      - name: Install Playwright Browsers
        run: make ui-test-setup

      - name: Run Playwright Tests
        id: playwright-tests
        env:
          MESHERY_SERVER_URL: 'http://localhost:9081'
          REMOTE_PROVIDER_URL: "https://cloud.meshery.io"
          # ui/tests/e2e/env.js reads PROVIDER_TOKEN; the org secret that holds a
          # maintained token for the purpose-built remote-provider CI test user
          # is REMOTE_PROVIDER_TEST_USER_TOKEN - the same one mesheryctl-e2e.yaml
          # uses. Do not point this at PROVIDER_TOKEN: that org secret is a
          # static token last refreshed 2024-03-08 and has expired.
          PROVIDER_TOKEN: ${{ secrets.REMOTE_PROVIDER_TEST_USER_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            make ui-test-e2e-full
          else
            make ui-test-e2e-local
          fi
        # Deliberately tolerated here so the artifact upload below still runs on
        # a failing suite; the verdict is enforced by the gate at the end of the
        # job, which is the step that decides the job's conclusion.
        continue-on-error: true

      - name: Upload Test Artifacts
        uses: ./.github/actions/upload-test-artifacts
        with:
          include-pr-metadata: ${{ github.event_name == 'pull_request' }}

      # The gate. Without it this job reported success no matter what Playwright
      # said: across the 20 "Meshery Build And Test" runs to 2026-08-05 the E2E
      # job concluded success 19 times out of 19, including 8 runs that had real
      # test failures, and it failed the build 0 times. Every test in this suite
      # was decorative for as long as that was true.
      #
      # `outcome` is the step's result before continue-on-error is applied;
      # `conclusion` is after, and is always success here. Gating on conclusion
      # is the mistake that makes this look enforced while it is not.
      - name: Fail job when Playwright reports test failures
        if: ${{ steps.playwright-tests.outcome == 'failure' }}
        run: |
          echo "::error::Playwright reported test failures. See the E2E Test Report artifact and the Allure report."
          exit 1
