name: Meshery UI and Server
on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: Enable debug logging
        required: false
        default: false
        type: boolean
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - "master"
    paths-ignore:
      - "docs/**"
      - "mesheryctl/**"
      - "*.md"
      - "*.github/**"
      - "Makefile"
  push:
    branches:
      - "master"
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "*.github/**"

permissions: read-all

concurrency:
  group: build-ui-and-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    if: github.repository == 'meshery/meshery'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checkout_ref: ${{ steps.detect.outputs.checkout_ref }}
      run_build: ${{ steps.detect.outputs.run_build }}
      run_docker: ${{ steps.detect.outputs.run_docker }}
      run_graphql: ${{ steps.detect.outputs.run_graphql }}
      run_rego: ${{ steps.detect.outputs.run_rego }}
      run_qa_sync: ${{ steps.detect.outputs.run_qa_sync }}
    steps:
      - name: 🔍 Introspect Inputs
        run: |
          echo "::group::Workflow Inputs"
          echo "Debug Mode: ${{ inputs.debug_mode || false }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "::endgroup::"
      - name: Detect changed files
        id: detect
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const ignoredPrefixes = ['docs/', 'mesheryctl/', '.github/'];
            const ignoredExact = new Set(['Makefile']);
            const graphQLFiles = new Set(['server/internal/graphql/schema/schema.graphql']);
            const regoWorkflow = '.github/workflows/rego-lint-and-test.yml';

            const isIgnored = (file) => {
              return ignoredExact.has(file) || file.endsWith('.md') || ignoredPrefixes.some((prefix) => file.startsWith(prefix));
            };

            const listPullRequestFiles = async () => {
              return github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                },
                (response) => response.data.map((file) => file.filename),
              );
            };

            const listPushFiles = async () => {
              const before = context.payload.before;
              const after = context.payload.after || context.sha;

              if (!before || /^0+$/.test(before)) {
                const commit = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: after,
                  per_page: 100,
                });

                return (commit.data.files || []).map((file) => file.filename);
              }

              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${before}...${after}`,
                per_page: 100,
              });

              return (comparison.data.files || []).map((file) => file.filename);
            };

            let files = [];
            if (context.eventName === 'workflow_dispatch') {
              files = [];
            } else if (context.eventName === 'pull_request_target') {
              files = await listPullRequestFiles();
            } else {
              files = await listPushFiles();
            }

            const uniqueFiles = [...new Set(files)];
            core.info(`Changed files: ${uniqueFiles.length ? uniqueFiles.join(', ') : 'workflow_dispatch (full run)'}`);

            const runAll = context.eventName === 'workflow_dispatch';
            const hasRelevantChanges = runAll || uniqueFiles.some((file) => !isIgnored(file));
            const runGraphql = runAll || uniqueFiles.some((file) => graphQLFiles.has(file));
            const runRego = runAll || uniqueFiles.some((file) => file.endsWith('.rego') || file.startsWith('server/policies/') || file === regoWorkflow);
            const checkoutRef = context.eventName === 'pull_request_target'
              ? context.payload.pull_request.head.sha
              : context.sha;

            core.setOutput('checkout_ref', checkoutRef);
            core.setOutput('run_build', String(hasRelevantChanges));
            core.setOutput('run_docker', String(hasRelevantChanges));
            core.setOutput('run_graphql', String(runGraphql));
            core.setOutput('run_rego', String(runRego));
            core.setOutput('run_qa_sync', String(context.eventName === 'push'));

  backend-build:
    name: Backend build
    needs: [changes]
    if: github.repository == 'meshery/meshery' && needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 🔍 Introspect Inputs
        run: |
          echo "::group::Workflow Inputs"
          echo "Debug Mode: ${{ inputs.debug_mode || false }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Checkout Ref: ${{ needs.changes.outputs.checkout_ref }}"
          echo "::endgroup::"
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: "**/*.sum"
      - name: Build backend
        run: make build-server
      - name: Upload backend artifact
        uses: actions/upload-artifact@v6
        with:
          name: meshery-backend
          retention-days: 30
          path: /home/runner/work/meshery/meshery/main

  ui-build:
    name: UI build
    needs: [changes]
    if: github.repository == 'meshery/meshery' && needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 🔍 Introspect Inputs
        run: |
          echo "::group::Workflow Inputs"
          echo "Debug Mode: ${{ inputs.debug_mode || false }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Checkout Ref: ${{ needs.changes.outputs.checkout_ref }}"
          echo "::endgroup::"
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      - name: Build meshery-ui and provider-ui
        run: make ui-build
      - name: Upload meshery-ui artifacts
        uses: actions/upload-artifact@v6
        with:
          name: meshery-ui
          retention-days: 30
          path: /home/runner/work/meshery/meshery/ui/out
      - name: Upload provider-ui artifacts
        uses: actions/upload-artifact@v6
        with:
          name: provider-ui
          retention-days: 30
          path: /home/runner/work/meshery/meshery/provider-ui/out

  tests-ui-e2e:
    name: UI end-to-end tests
    needs: [changes, backend-build, ui-build]
    environment: staging-playground
    if: github.repository == 'meshery/meshery' && needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 🔍 Introspect Inputs
        run: |
          echo "::group::Workflow Inputs"
          echo "Debug Mode: ${{ inputs.debug_mode || false }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Checkout Ref: ${{ needs.changes.outputs.checkout_ref }}"
          echo "::endgroup::"
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: "kind-cluster"
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      - name: Download backend artifact
        uses: actions/download-artifact@v6
        with:
          name: meshery-backend
          path: /home/runner/work/meshery/meshery
      - name: Download meshery-ui artifacts
        uses: actions/download-artifact@v6
        with:
          name: meshery-ui
          path: /home/runner/work/meshery/meshery/ui/out
      - name: Download provider-ui artifacts
        uses: actions/download-artifact@v6
        with:
          name: provider-ui
          path: /home/runner/work/meshery/meshery/provider-ui/out
      - name: Run Meshery UI and Server
        run: |
          chmod +x ./main
          ./main &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:9081/healthz/ready >/dev/null; then
              echo "Meshery server is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Meshery server did not become ready within 90 seconds."
          exit 1
      - name: Install Playwright
        run: make ui-setup-ci
      - name: Install Playwright Browsers
        run: make ui-test-setup
      - name: Run Playwright End-to-End Tests
        env:
          MESHERY_SERVER_URL: "http://localhost:9081"
          REMOTE_PROVIDER_URL: "https://cloud.layer5.io"
          PROVIDER_TOKEN: ${{ secrets.REMOTE_PROVIDER_TEST_USER_TOKEN }}
        run: make ui-test-e2e-ci
      - name: Save PR metadata
        if: ${{ !cancelled() && github.event_name == 'pull_request_target' }}
        run: |
          mkdir -p ./pr
          echo "${{ github.event.number }}" > ./pr/number
          echo "${{ github.event.pull_request.head.sha }}" > ./pr/sha

      - name: Checkout QA
        uses: actions/checkout@v6
        if: ${{ !cancelled() && needs.changes.outputs.run_qa_sync == 'true' }}
        with:
          repository: meshery/qa
          path: ./qa
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Sync results with qa
        if: ${{ !cancelled() && needs.changes.outputs.run_qa_sync == 'true' }}
        working-directory: qa
        run: |
          make meshery-results-sync MESHERY_RESULTS_PATH=../ui/allure-results

      - name: Pull latest qa changes
        if: ${{ !cancelled() && needs.changes.outputs.run_qa_sync == 'true' }}
        working-directory: qa
        run: git pull --rebase --autostash origin master

      - name: Commit & push academy to qa
        if: ${{ !cancelled() && needs.changes.outputs.run_qa_sync == 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[Meshery] Sync Meshery E2E Test Results - ${GITHUB_SHA}"
          commit_options: "--signoff"
          repository: qa
          commit_user_name: meshery-ci
          commit_user_email: ci@meshery.io
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Upload Test Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a # v4.3.6
        with:
          name: e2e-test-reporter
          path: |
            ui/test-report.md
            pr/
          retention-days: 14
      - name: Upload Playwright Trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 14
      - name: Upload Playwright HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 14

  docker-build-test:
    name: Docker build
    needs: [changes]
    if: github.repository == 'meshery/meshery' && needs.changes.outputs.run_docker == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 🔍 Introspect Inputs
        run: |
          echo "::group::Workflow Inputs"
          echo "Debug Mode: ${{ inputs.debug_mode || false }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "::endgroup::"
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
      - name: Docker edge build & tag
        if: startsWith(github.ref, 'refs/tags/') != true && success()
        env:
          RELEASE_CHANNEL: "edge"
        run: |
          DOCKER_BUILDKIT=1 docker build -f install/docker/Dockerfile --no-cache -t meshery:edge-latest --build-arg TOKEN=test --build-arg GIT_COMMITSHA=${GITHUB_SHA::8} --build-arg RELEASE_CHANNEL=${RELEASE_CHANNEL} .
          docker tag meshery:edge-latest meshery:edge-${GITHUB_SHA::8}
      - name: Docker edge push
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') && success()
        run: |
          docker push ${{ secrets.IMAGE_NAME }}:edge-latest
          docker push ${{ secrets.IMAGE_NAME }}:edge-${GITHUB_REF/refs\/tags\//}
          docker push ${{ secrets.IMAGE_NAME }}:edge-${GITHUB_SHA::8}
      - name: Docker Hub Description
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') && success()
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ secrets.IMAGE_NAME }}

  graphql_validate:
    name: Validate GraphQL schema
    needs: [changes]
    if: github.repository == 'meshery/meshery' && needs.changes.outputs.run_graphql == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 🔍 Introspect Inputs
        run: |
          echo "::group::Workflow Inputs"
          echo "Debug Mode: ${{ inputs.debug_mode || false }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Checkout Ref: ${{ needs.changes.outputs.checkout_ref }}"
          echo "::endgroup::"
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.changes.outputs.checkout_ref }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.6
          bundler-cache: true
      - name: graphql-docs
        run: |
          cd docs
          bundle install
          bundle exec rake graphql:compile_docs

  rego-tests:
    name: Rego Policy Tests
    needs: [changes]
    if: github.repository == 'meshery/meshery' && needs.changes.outputs.run_rego == 'true'
    uses: ./.github/workflows/rego-lint-and-test.yml
    permissions:
      contents: write
      pull-requests: write

  notify:
    name: Notify workflow status
    needs:
      - changes
      - backend-build
      - ui-build
      - tests-ui-e2e
      - docker-build-test
      - graphql_validate
      - rego-tests
    if: ${{ always() && github.repository == 'meshery/meshery' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: 🔍 Introspect Inputs
        run: |
          echo "::group::Workflow Inputs"
          echo "Debug Mode: ${{ inputs.debug_mode || false }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Needs: ${{ toJson(needs) }}"
          echo "::endgroup::"
      - name: Comment on PR status
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v8
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_BUILD_RESULT: ${{ needs['backend-build'].result }}
          UI_BUILD_RESULT: ${{ needs['ui-build'].result }}
          UI_E2E_RESULT: ${{ needs['tests-ui-e2e'].result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build-test'].result }}
          GRAPHQL_VALIDATE_RESULT: ${{ needs.graphql_validate.result }}
          REGO_TESTS_RESULT: ${{ needs['rego-tests'].result }}
        with:
          script: |
            const marker = '<!-- meshery-ui-and-server-status -->';
            const statuses = {
              changes: process.env.CHANGES_RESULT,
              backendBuild: process.env.BACKEND_BUILD_RESULT,
              uiBuild: process.env.UI_BUILD_RESULT,
              uiEndToEndTests: process.env.UI_E2E_RESULT,
              dockerBuild: process.env.DOCKER_BUILD_RESULT,
              graphqlValidate: process.env.GRAPHQL_VALIDATE_RESULT,
              regoTests: process.env.REGO_TESTS_RESULT,
            };

            const lines = Object.entries(statuses)
              .filter(([, status]) => status && status !== 'skipped')
              .map(([name, status]) => `- ${name}: ${status}`);

            const body = [
              marker,
              '### Meshery UI and Server workflow update',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              ...lines,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Send email notification on failure
        if: contains(needs.*.result, 'failure')
        uses: dawidd6/action-send-mail@v7
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Meshery UI and Server workflow failed - ${{ github.run_id }}
          to: maintainers@meshery.io
          from: Meshery UI and Server workflow
          body: |
            The Meshery UI and Server workflow failed.

            Repository: ${{ github.repository }}
            Event: ${{ github.event_name }}
            Ref: ${{ github.ref }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Job results: ${{ toJson(needs) }}
