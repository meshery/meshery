name: MeshKit Error Codes Utility Runner
on:
  push:
    branches:
      - "master"
    paths:
      - "**.go"
      - ".github/workflows/error-codes-updater.yaml"
  pull_request:
    branches:
      - "master"
    paths:
      - "**.go"
      - ".github/workflows/error-codes-updater.yaml"

jobs:
  Update-error-codes:
    name: Error codes utility
    if: github.repository == 'meshery/meshery'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Checkout base branch
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .baseline
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        if: ${{ github.event_name == 'push' }}
        with:
          ref: "master"
          fetch-depth: 1
          token: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build Error Utility
        run: |
          go get github.com/meshery/meshkit/cmd/errorutil@master
          go build -o ~/errorutil github.com/meshery/meshkit/cmd/errorutil

      - name: Run Utility For Meshery Server
        uses: ./.github/actions/errorutil-runner
        with:
          scan_dir: '.'
          baseline_scan_dir: '.baseline'
          helpers_dir: './server/helpers'
          baseline_helpers_dir: '.baseline/server/helpers'
          skip_dirs: 'mesheryctl,docs'
          export_dest: './docs/data/errorref/meshery-server_errors_export.json'

      - name: Run Utility For Mesheryctl
        uses: ./.github/actions/errorutil-runner
        with:
          scan_dir: './mesheryctl'
          baseline_scan_dir: '.baseline/mesheryctl'
          helpers_dir: './mesheryctl/helpers'
          baseline_helpers_dir: '.baseline/mesheryctl/helpers'
          skip_dirs: ''
          export_dest: './docs/data/errorref/mesheryctl_errors_export.json'

      - name: Pull changes from remote
        if: ${{ github.event_name != 'pull_request' }}  # Skip for pull requests
        run: git pull origin master

      - name: Commit changes
        if: ${{ github.event_name != 'pull_request' }} # Skip for pull requests
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: mesheryctl/helpers server/helpers/ **.go docs/
          commit_user_name: l5io
          commit_user_email: ci@meshery.io
          commit_author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          commit_options: "--signoff"
          commit_message: "[Error Codes]: Update Meshery server and mehseryctl error codes and reference"
