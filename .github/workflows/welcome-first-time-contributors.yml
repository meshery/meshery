name: Welcome First-Time Contributors

# This workflow automatically welcomes new contributors when they open their first
# issue or pull request. It checks if the author has previously opened an issue or PR
# and posts a friendly, informative comment that:
#   - Welcomes the contributor to the Meshery community
#   - Invites them to the weekly development meeting (https://meet.meshery.io)
#   - Encourages them to join the community Slack workspace (https://slack.meshery.io)
#   - Optionally invites them to fill in the newcomer form (https://meshery.io/newcomer)

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

# Least privilege: only comment on issues/PRs. Never check out PR code here.
permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome First-Time Contributor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event.issue.user.type || github.event.pull_request.user.type) != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
      github.event.issue.author_association || github.event.pull_request.author_association)

    steps:
      - name: 🎉 Welcome first-time author
        uses: actions/github-script@v9
        with:
          script: |
            const isIssue = context.eventName === 'issues';
            const item = isIssue ? context.payload.issue : context.payload.pull_request;
            const author = item.user.login;
            const number = item.number;
            const { owner, repo } = context.repo;

            // Issues and PRs share one list (newest first). Stop at the first
            // earlier item of the same kind by this author.
            // The list mixes both kinds, so match the kind of the current item:
            // an issue event looks for earlier issues, a PR event for earlier PRs.
            const isSameKind = i => Boolean(i.pull_request) === !isIssue;
            let hasPrior = false;
            for await (const { data } of github.paginate.iterator(
              github.rest.issues.listForRepo,
              { owner, repo, creator: author, state: 'all', per_page: 100 }
            )) {
              if (data.some(i => isSameKind(i) && i.number < number)) {
                hasPrior = true;
                break;
              }
            }
            if (hasPrior) {
              core.info(`${author} already has a prior ${isIssue ? 'issue' : 'PR'}. Skipping welcome.`);
              return;
            }

            const section = (title, text, label, url) =>
              [title, text, `👉 **[${label}](${url})**`, ''];

            const copy = {
              issue: {
                thanks: `Thank you for opening your first issue — we're glad you're here! 🚀`,
                intro: [
                  'Meshery is a CNCF project and a vibrant open-source community. Here are a few ways to get connected and make the most of your contribution journey:',
                  ''
                ],
                meeting: 'We hold a public development meeting every week where anyone can join, ask questions, share ideas, and pair with maintainers. New contributors are especially welcome!',
                slack: 'The fastest way to get help, share ideas, or just say hi is through our Slack workspace. Jump in — we\'d love to meet you!',
                newcomer: 'Fill in our newcomer form to introduce yourself, unlock additional resources, and get added to our community directory.',
                outro: [
                  'A maintainer will review your issue shortly. In the meantime, feel free to explore our [contributing guide](https://docs.meshery.io/project/contributing) and [documentation](https://docs.meshery.io).',
                  '',
                  'We\'re happy to have you! 🎊'
                ]
              },
              pr: {
                thanks: `Thank you for opening your first pull request — this is a big moment and we're excited to review your contribution! 🚀`,
                intro: [
                  'Here are a few things that will help your PR get merged smoothly:',
                  '',
                  '- ✅ **DCO sign-off** — make sure every commit is signed off (`git commit -s`) as required by our [Developer Certificate of Origin](https://docs.meshery.io/project/contributing).',
                  '- 🧪 **Tests** — if your change affects functionality, please include or update tests.',
                  '- 📝 **Description** — a clear PR description helps reviewers understand your intent quickly.',
                  ''
                ],
                meeting: 'We hold a public development meeting every week. It\'s a great place to walk through your PR with a maintainer or ask any questions you have.',
                slack: 'Connect with other contributors and get real-time help from the community.',
                newcomer: 'Fill in our newcomer form to introduce yourself and unlock additional community resources.',
                outro: ['A maintainer will review your PR shortly. Thank you for contributing to Meshery! 🎊']
              }
            };

            const c = copy[isIssue ? 'issue' : 'pr'];
            const body = [
              `👋 **Welcome to Meshery, @${author}!**`,
              '',
              c.thanks,
              '',
              ...c.intro,
              '---',
              '',
              ...section('📅 **Join our Weekly Community Meeting**', c.meeting, 'Add to calendar & join at meet.meshery.io', 'https://meet.meshery.io'),
              ...section('💬 **Join the Meshery Community Slack**', c.slack, 'Join Slack at slack.meshery.io', 'https://slack.meshery.io'),
              ...section('🌟 **Become a Community Member**', c.newcomer, 'Newcomer form at meshery.io/newcomer', 'https://meshery.io/newcomer'),
              '---',
              '',
              ...c.outro
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body
            });

      - name: 🚨 Alert on Failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: CLDRKJZ0T
            text: ":warning: *Welcome Workflow Failed*\n\nThe `welcome-first-time-contributors` workflow failed for actor `${{ github.actor }}` on event `${{ github.event_name }}`.\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run logs>"
