name: Deploy Hugo site to Pages

# docs.meshery.io is published from a GitHub Actions Pages artifact, not from
# the gh-pages branch. The artifact holds exactly the production site, so pull
# request previews (published to meshery/docs-preview by
# deploy-docs-preview.yml) can never push it over the 1 GB GitHub Pages limit
# or race this workflow for a branch (#23221). The repository's Pages source
# must be set to "GitHub Actions" for this to take effect.

on:
  push:
    branches:
      - master
    # Every change except CI-only and archive-only ones, but including this
    # workflow itself, so a change to how the site deploys is exercised on merge.
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/hugo.yml'
      - '!archive/**'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A deployment in progress is never cancelled (that
# can leave Pages without a live deployment); runs queued behind it collapse to
# the newest, which already contains every earlier change.
concurrency:
  group: pages-deployment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'meshery/meshery'
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.157.0
    steps:
      - name: Checkout docs source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1
          # Only the Hugo site input is needed to build docs.meshery.io.
          # A blobless, cone-mode sparse checkout pulls the docs/ tree (plus
          # the root files the Makefile target needs) instead of cloning the
          # entire repository, which materially cuts checkout IO. There are no
          # submodules, so submodule fetching is intentionally omitted.
          filter: blob:none
          sparse-checkout: |
            install
            docs
          sparse-checkout-cone-mode: true
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        # Direct download from the dart-sass GitHub release rather than
        # `sudo snap install dart-sass` (snap.io's storeserver was flaky on
        # GitHub-hosted runners and broke docs builds on unrelated PRs, see
        # #19574). Hugo Extended ships embedded Dart Sass as of v0.114+ but
        # keeping the standalone binary on PATH is the most reliable path
        # through `resources.toCSS` with transpiler "dartsass".
        env:
          DART_SASS_VERSION: 1.79.5
        run: |
          set -eu
          cd "${RUNNER_TEMP}"
          curl -fsSL -o dart-sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          sudo tar -xzf dart-sass.tar.gz -C /usr/local/lib
          sudo ln -sf /usr/local/lib/dart-sass/sass /usr/local/bin/sass
          sudo ln -sf /usr/local/lib/dart-sass/sass /usr/local/bin/dart-sass
          dart-sass --version
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install Node.js dependencies
        run: |
          cd docs
          npm ci
      - name: Build with Hugo
        env:
          # For maximum backward compatibility with Hugo modules
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          make -C docs build-production BASE_URL="/"
      - name: Fit the site under the GitHub Pages size limit
        # GitHub Pages rejects a site over 1 GB. The current docs (~250 MB,
        # since the sidebar tree is published once instead of inlined into
        # every page) plus the archived v0.8 and v0.9 snapshots (~650 MB) fit.
        # If growth pushes the site past 900 MB, drop the archives, oldest
        # first, rather than fail to publish the current docs, and say so in
        # the run summary so the regression is visible.
        run: |
          set -eu
          LIMIT=$((900 * 1024 * 1024))
          size_of() { du -sb "$1" | awk '{print $1}'; }
          human() { du -sh --apparent-size "$1" | awk '{print $1}'; }
          echo "docs/public is $(human docs/public) ($(size_of docs/public) bytes)"
          trim() {
            local path="$1"
            local reason="$2"
            if [ -e "$path" ] && [ "$(size_of docs/public)" -gt "$LIMIT" ]; then
              rm -rf "$path"
              msg="Dropped ${path#docs/public/} ($reason) to keep docs.meshery.io under the 1 GB GitHub Pages limit; the site is now $(human docs/public). Those URLs will 404 until the site is slimmed."
              echo "::warning title=Docs site over size budget::$msg"
              echo "- :warning: $msg" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          trim docs/public/v0.8 "archived v0.8 snapshot; source remains in docs/static/v0.8"
          trim docs/public/v0.9 "archived v0.9 snapshot; source remains in docs/static/v0.9"
          if [ "$(size_of docs/public)" -gt "$LIMIT" ]; then
            echo "::error::docs/public is still $(human docs/public) after dropping the archived snapshots; it must be under 900 MB to publish to GitHub Pages."
            exit 1
          fi
          echo "- Publishing $(human docs/public) to docs.meshery.io" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
