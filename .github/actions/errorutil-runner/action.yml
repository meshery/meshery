name: 'Error Codes Utility Runner'
description: 'Runs errorutil update, analyze, and check for a specific component'
inputs:
  scan_dir:
    description: 'Directory to scan (e.g. . or ./mesheryctl)'
    required: true
  baseline_scan_dir:
    description: 'Baseline directory to scan (e.g. .baseline or .baseline/mesheryctl)'
    required: true
  helpers_dir:
    description: 'Directory for helpers (e.g. ./server/helpers or ./helpers)'
    required: true
  baseline_helpers_dir:
    description: 'Baseline directory for helpers (e.g. .baseline/server/helpers or .baseline/mesheryctl/helpers)'
    required: true
  skip_dirs:
    description: 'Directories to skip'
    required: true
  export_dest:
    description: 'Destination file for exported JSON (e.g. ./docs/data/errorref/meshery-server_errors_export.json)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Run Utility
      shell: bash
      run: |
        set -eo pipefail
        
        # Run errorutil from the workspace root for all components, using the provided
        # scan/helpers paths (expressed relative to the workspace root).
        
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          ~/errorutil -d "${{ inputs.baseline_scan_dir }}" analyze -i "${{ inputs.baseline_helpers_dir }}" -o "${{ inputs.baseline_helpers_dir }}" --skip-dirs "${{ inputs.skip_dirs }}"

          ~/errorutil -d "${{ inputs.scan_dir }}" analyze -i "${{ inputs.helpers_dir }}" -o "${{ inputs.helpers_dir }}" --skip-dirs "${{ inputs.skip_dirs }},.baseline"

          # Convention gate, parity with the post-merge `analyze | wc -c` gate.
          # Duplicate error names, call-expression codes and deprecated NewDefault
          # usage are NOT covered by `errorutil check`. Read them from the summary
          # rather than from log output: on the read-only PR path an unallocated
          # "replace_me" placeholder makes Export log an error, which would make a
          # byte-count gate reject the primary supported workflow.
          # Applied to the CURRENT tree only - never to the baseline, which would
          # fail pull requests for pre-existing state.
          SUMMARY="${{ inputs.helpers_dir }}/errorutil_analyze_summary.json"
          if ! jq -e '(.duplicate_names | length) == 0 and (.call_expr_codes | length) == 0 and (.deprecated_new_default | length) == 0' "$SUMMARY" >/dev/null; then
            echo "::error::errorutil analyze reported error-convention violations in ${{ inputs.helpers_dir }}"
            jq '{duplicate_names, call_expr_codes, deprecated_new_default}' "$SUMMARY"
            exit 1
          fi

          ~/errorutil check \
            "${{ inputs.baseline_helpers_dir }}/errorutil_analyze_errors.json" \
            "${{ inputs.helpers_dir }}/errorutil_analyze_errors.json" \
            --baseline-summary "${{ inputs.baseline_helpers_dir }}/errorutil_analyze_summary.json" \
            --current-summary "${{ inputs.helpers_dir }}/errorutil_analyze_summary.json"
        else
          ~/errorutil update -d "${{ inputs.scan_dir }}" -i "${{ inputs.helpers_dir }}" -o "${{ inputs.helpers_dir }}" --skip-dirs "${{ inputs.skip_dirs }},.baseline"
          
          output=$(~/errorutil -d "${{ inputs.scan_dir }}" analyze -i "${{ inputs.helpers_dir }}" -o "${{ inputs.helpers_dir }}" --skip-dirs "${{ inputs.skip_dirs }},.baseline" | wc -c)
          if [ "$output" -ne 0 ]; then
            exit 1
          fi
          
          echo '{ "errors_export": "" }' | jq --slurpfile export "${{ inputs.helpers_dir }}/errorutil_errors_export.json" '.errors_export = $export[0]' > "${{ inputs.export_dest }}"
        fi
