name: 3-Tier Web Application on Kubernetes
schemaVersion: designs.meshery.io/v1beta1
version: 0.0.3
metadata:
  description: "A 3-tier cloud-native architecture connecting an Nginx web frontend UI, a FastAPI backend API, and a PostgreSQL database using Kubernetes Deployments, Services, ConfigMaps, PersistentVolumeClaims, Secrets, and a dedicated Namespace."
  categories:
    - App Delivery
    - Cloud Native
  prerequisites:
    - "Set a secure password for the 'POSTGRES_PASSWORD' key in 'postgres-secret' at deployment time or pre-provision it via secret management (e.g., SealedSecrets, External Secrets Operator) before applying to prevent credential overwrite."
  notes:
    - "Frontend Reverse Proxy: Uses Nginx alpine's built-in envsubst template mechanism (/etc/nginx/templates/default.conf.template) to route /api/ traffic dynamically to the FastAPI backend service (${BACKEND_API_URL})."
    - "Backend Configuration: The tiangolo/uvicorn-gunicorn-fastapi image runs the ASGI application server; the DB_* environment variables establish the connection contract consumed by FastAPI application code."
    - "Database Persistence & Workload Strategy: PostgreSQL uses 'strategy.type: Recreate' and 'PGDATA: /var/lib/postgresql/data/pgdata' to ensure safe single-replica mounting and prevent multi-attach conflicts on ReadWriteOnce (RWO) storage during redeployment."
components:
  - id: comp-namespace
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: Three-Tier App Namespace
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: Namespace
      version: v1
    configuration:
      metadata:
        name: three-tier-app
        labels:
          app.kubernetes.io/name: three-tier-app

  - id: comp-frontend-config
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: Frontend ConfigMap
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: ConfigMap
      version: v1
    configuration:
      metadata:
        name: frontend-config
        namespace: three-tier-app
        labels:
          app: frontend-ui
      data:
        BACKEND_API_URL: "http://backend-service:8000"
        default.conf.template: |
          server {
              listen 80;
              server_name localhost;

              location / {
                  root /usr/share/nginx/html;
                  index index.html index.htm;
                  try_files $uri $uri/ /index.html;
              }

              location /api/ {
                  proxy_pass ${BACKEND_API_URL}/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

  - id: comp-frontend-dep
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: Frontend UI Deployment
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: Deployment
      version: apps/v1
    configuration:
      metadata:
        name: frontend-deployment
        namespace: three-tier-app
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: frontend-ui
        template:
          metadata:
            labels:
              app: frontend-ui
          spec:
            containers:
              - name: frontend-ui
                image: nginx:alpine
                ports:
                  - containerPort: 80
                    name: http
                env:
                  - name: BACKEND_API_URL
                    valueFrom:
                      configMapKeyRef:
                        name: frontend-config
                        key: BACKEND_API_URL
                volumeMounts:
                  - name: nginx-conf-template
                    mountPath: /etc/nginx/templates/default.conf.template
                    subPath: default.conf.template
            volumes:
              - name: nginx-conf-template
                configMap:
                  name: frontend-config
                  items:
                    - key: default.conf.template
                      path: default.conf.template

  - id: comp-frontend-svc
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: Frontend Service
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: Service
      version: v1
    configuration:
      metadata:
        name: frontend-service
        namespace: three-tier-app
      spec:
        type: LoadBalancer
        selector:
          app: frontend-ui
        ports:
          - port: 80
            targetPort: 80
            name: http

  - id: comp-backend-config
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: Backend ConfigMap
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: ConfigMap
      version: v1
    configuration:
      metadata:
        name: backend-config
        namespace: three-tier-app
        labels:
          app: fastapi-backend
      data:
        DB_HOST: "postgres-service"
        DB_PORT: "5432"
        DB_NAME: "appdb"
        DB_USER: "appuser"

  - id: comp-backend-dep
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: FastAPI Backend Deployment
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: Deployment
      version: apps/v1
    configuration:
      metadata:
        name: backend-deployment
        namespace: three-tier-app
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: fastapi-backend
        template:
          metadata:
            labels:
              app: fastapi-backend
          spec:
            containers:
              - name: fastapi-backend
                image: tiangolo/uvicorn-gunicorn-fastapi:python3.10-slim
                ports:
                  - containerPort: 8000
                    name: http
                env:
                  - name: DB_HOST
                    valueFrom:
                      configMapKeyRef:
                        name: backend-config
                        key: DB_HOST
                  - name: DB_PORT
                    valueFrom:
                      configMapKeyRef:
                        name: backend-config
                        key: DB_PORT
                  - name: DB_NAME
                    valueFrom:
                      configMapKeyRef:
                        name: backend-config
                        key: DB_NAME
                  - name: DB_USER
                    valueFrom:
                      configMapKeyRef:
                        name: backend-config
                        key: DB_USER
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgres-secret
                        key: POSTGRES_PASSWORD

  - id: comp-backend-svc
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: Backend Service
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: Service
      version: v1
    configuration:
      metadata:
        name: backend-service
        namespace: three-tier-app
      spec:
        type: ClusterIP
        selector:
          app: fastapi-backend
        ports:
          - port: 8000
            targetPort: 8000
            name: http

  - id: comp-postgres-secret
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: PostgreSQL Secret
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: Secret
      version: v1
    configuration:
      metadata:
        name: postgres-secret
        namespace: three-tier-app
        labels:
          app: postgres
      type: Opaque
      stringData:
        POSTGRES_DB: appdb
        POSTGRES_USER: appuser
        POSTGRES_PASSWORD: ""

  - id: comp-postgres-pvc
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: PostgreSQL PVC
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: PersistentVolumeClaim
      version: v1
    configuration:
      metadata:
        name: postgres-pvc
        namespace: three-tier-app
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

  - id: comp-postgres-dep
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: PostgreSQL Deployment
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: Deployment
      version: apps/v1
    configuration:
      metadata:
        name: postgres-deployment
        namespace: three-tier-app
      spec:
        replicas: 1
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: postgres
        template:
          metadata:
            labels:
              app: postgres
          spec:
            containers:
              - name: postgres
                image: postgres:16-alpine
                ports:
                  - containerPort: 5432
                    name: postgres
                env:
                  - name: PGDATA
                    value: /var/lib/postgresql/data/pgdata
                  - name: POSTGRES_DB
                    valueFrom:
                      secretKeyRef:
                        name: postgres-secret
                        key: POSTGRES_DB
                  - name: POSTGRES_USER
                    valueFrom:
                      secretKeyRef:
                        name: postgres-secret
                        key: POSTGRES_USER
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgres-secret
                        key: POSTGRES_PASSWORD
                volumeMounts:
                  - name: postgres-storage
                    mountPath: /var/lib/postgresql/data
            volumes:
              - name: postgres-storage
                persistentVolumeClaim:
                  claimName: postgres-pvc

  - id: comp-postgres-svc
    schemaVersion: components.meshery.io/v1beta1
    version: v1.0.0
    displayName: PostgreSQL Service
    format: JSON
    model:
      name: kubernetes
      version: v1.28.0
    component:
      kind: Service
      version: v1
    configuration:
      metadata:
        name: postgres-service
        namespace: three-tier-app
      spec:
        type: ClusterIP
        selector:
          app: postgres
        ports:
          - port: 5432
            targetPort: 5432
            name: postgres

relationships:
  - id: rel-frontend-to-backend
    schemaVersion: relationships.meshery.io/v1beta1
    version: v1.0.0
    kind: edge
    type: non-binding
    subType: network
    selectors:
      - allow:
          from:
            - kind: Deployment
              id: comp-frontend-dep
          to:
            - kind: Service
              id: comp-backend-svc
    styles:
      lineStyle: solid
      lineColor: "#00B39F"
      label: "HTTP REST :8000"

  - id: rel-backend-to-postgres
    schemaVersion: relationships.meshery.io/v1beta1
    version: v1.0.0
    kind: edge
    type: non-binding
    subType: network
    selectors:
      - allow:
          from:
            - kind: Deployment
              id: comp-backend-dep
          to:
            - kind: Service
              id: comp-postgres-svc
    styles:
      lineStyle: solid
      lineColor: "#326CE5"
      label: "TCP :5432"
