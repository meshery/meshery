    {
      "id": "38bb5239-023a-4a35-9fa8-59ef0e3d663b",
      "schemaVersion": "components.meshery.io/v1beta2",
      "version": "v1.0.0",
      "displayName": "resilient-web-gateway",
      "description": "",
      "format": "",
      "model": null,
      "modelReference": {
        "displayName": "Kubernetes",
        "id": "00000000-0000-0000-0000-000000000000",
        "model": {
          "version": "v1.37.0-rc.1"
        },
        "name": "kubernetes",
        "registrant": {
          "kind": "github"
        },
        "version": "v1.0.0"
      },
      "styles": {
        "background-image": "none",
        "background-opacity": 0.5,
        "border-width": 2,
        "primaryColor": "#326CE5",
        "secondaryColor": "#7aa1f0",
        "shape": "round-rectangle",
        "svgColor": "ui/public/static/img/meshmodels/kubernetes/color/deployment-color.svg",
        "svgComplete": "ui/public/static/img/meshmodels/kubernetes/complete/deployment-complete.svg",
        "svgWhite": "ui/public/static/img/meshmodels/kubernetes/white/deployment-white.svg"
      },
      "capabilities": null,
      "status": "enabled",
      "metadata": {
        "configurationUISchema": "",
        "genealogy": "parent",
        "instanceDetails": null,
        "isAnnotation": false,
        "isNamespaced": true,
        "published": false,
        "source_uri": "git://github.com/kubernetes/kubernetes/master/api/openapi-spec/v3"
      },
      "configuration": {
        "metadata": {
          "labels": {
            "app.kubernetes.io/component": "gateway",
            "app.kubernetes.io/name": "resilient-web-gateway"
          },
          "name": "resilient-web-gateway",
          "namespace": "meshery-demo"
        },
        "spec": {
          "replicas": 3,
          "selector": {
            "matchLabels": {
              "app.kubernetes.io/name": "resilient-web-gateway"
            }
          },
          "strategy": {
            "rollingUpdate": {
              "maxSurge": 1,
              "maxUnavailable": 1
            },
            "type": "RollingUpdate"
          },
          "template": {
            "metadata": {
              "labels": {
                "app.kubernetes.io/component": "gateway",
                "app.kubernetes.io/name": "resilient-web-gateway"
              }
            },
            "spec": {
              "containers": [
                {
                  "image": "nginxinc/nginx-unprivileged:1.27-alpine",
                  "livenessProbe": {
                    "httpGet": {
                      "path": "/",
                      "port": "http"
                    },
                    "initialDelaySeconds": 10,
                    "periodSeconds": 10
                  },
                  "name": "nginx",
                  "ports": [
                    {
                      "containerPort": 8080,
                      "name": "http"
                    }
                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/",
                      "port": "http"
                    },
                    "initialDelaySeconds": 3,
                    "periodSeconds": 5
                  },
                  "resources": {
                    "limits": {
                      "cpu": "500m",
                      "memory": "128Mi"
                    },
                    "requests": {
                      "cpu": "100m",
                      "memory": "64Mi"
                    }
                  },
                  "securityContext": {
                    "allowPrivilegeEscalation": false,
                    "capabilities": {
                      "drop": [
                        "ALL"
                      ]
                    },
                    "readOnlyRootFilesystem": true
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/usr/share/nginx/html",
                      "name": "web-content",
                      "readOnly": true
                    },
                    {
                      "mountPath": "/var/cache/nginx",
                      "name": "cache"
                    },
                    {
                      "mountPath": "/var/run",
                      "name": "run"
                    }
                  ]
                }
              ],
              "securityContext": {
                "runAsNonRoot": true,
                "seccompProfile": {
                  "type": "RuntimeDefault"
                }
              },
              "volumes": [
                {
                  "configMap": {
                    "name": "web-config"
                  },
                  "name": "web-content"
                },
                {
                  "emptyDir": {},
                  "name": "cache"
                },
                {
                  "emptyDir": {},
                  "name": "run"
                }
              ]
            }
          }
        }
      },
      "component": {
