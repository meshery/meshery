version: 0.0.2
name: resilient-web-gateway
displayName: Resilient Web Gateway
createdAt: "2026-08-24T18:22:12Z"
description: Resilient Web Gateway is a compact reference architecture for running an HTTP workload safely and reliably on Kubernetes. It combines a three-replica Deployment with rolling updates, health probes, resource controls, a non-root read-only container, a ClusterIP Service, ConfigMap-provided content, CPU-based horizontal autoscaling, a PodDisruptionBudget, and an ingress NetworkPolicy. It is designed for learning, workshops, and as a starting point for production-oriented services.
