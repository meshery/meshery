readme: "Requires a Kubernetes metrics provider such as Metrics Server for CPU-based autoscaling. The Service is cluster-internal; add an Ingress or Gateway API resource for external access. The cluster CNI must enforce Kubernetes NetworkPolicy. Pin the container image to a digest before controlled production use. \n ##h4 Caveats and Consideration \n"
