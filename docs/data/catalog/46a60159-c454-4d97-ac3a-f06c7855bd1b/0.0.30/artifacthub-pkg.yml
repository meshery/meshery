displayName: MongoDB with the Mongo Express admin UI
createdAt: "2026-10-05T17:25:39Z"
description: A two-tier setup that runs MongoDB with the Mongo Express web admin UI on Kubernetes. MongoDB is reachable only inside the cluster through a ClusterIP Service, while Mongo Express is exposed through a NodePort Service. Credentials are kept in a Secret and the database address in a ConfigMap, both referenced by the Deployments.
