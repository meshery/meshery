        "published": false,
        "source_uri": "git://github.com/kubernetes/kubernetes/master/api/openapi-spec/v3"
      },
      "configuration": {
        "metadata": {
          "labels": {
            "app": "mongodb"
          },
          "name": "mongodb",
          "namespace": "mongo-demo"
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "mongodb"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "mongodb"
              }
            },
            "spec": {
              "containers": [
                {
                  "env": [
                    {
                      "name": "MONGO_INITDB_ROOT_USERNAME",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "mongo-root-username",
                          "name": "mongodb-secret"
                        }
                      }
                    },
                    {
                      "name": "MONGO_INITDB_ROOT_PASSWORD",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "mongo-root-password",
                          "name": "mongodb-secret"
                        }
                      }
                    }
                  ],
                  "envFrom": [
                    {
                      "secretRef": {
                        "name": "mongodb-secret"
                      }
                    }
                  ],
                  "image": "mongo:7.0",
                  "name": "mongodb",
                  "ports": [
                    {
                      "containerPort": 27017,
                      "protocol": "TCP"
                    }
                  ],
                  "readinessProbe": {
                    "initialDelaySeconds": 10,
                    "periodSeconds": 10,
                    "tcpSocket": {
                      "port": 27017
                    }
                  },
                  "resources": {
                    "limits": {
                      "cpu": "500m",
                      "memory": "512Mi"
                    },
                    "requests": {
                      "cpu": "100m",
                      "memory": "256Mi"
                    }
                  }
                }
              ]
            }
          }
        }
      },
