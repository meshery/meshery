readme: "This is a sample application intended for learning and demonstration, not production use. It requires a Kubernetes cluster and access to the public Podinfo container image. Horizontal Pod Autoscaling requires a functioning metrics server in the cluster. The Service uses ClusterIP, so external access requires port-forwarding or an appropriate ingress or load balancer configuration. \n ##h4 Caveats and Consideration \n"
