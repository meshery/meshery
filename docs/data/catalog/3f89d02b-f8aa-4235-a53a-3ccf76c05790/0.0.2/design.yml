      },
      "styles": {
        "background-image": "none",
        "background-opacity": 0.5,
        "border-width": 2,
        "primaryColor": "#326CE5",
        "secondaryColor": "#7aa1f0",
        "shape": "round-rectangle",
        "svgColor": "ui/public/static/img/meshmodels/kubernetes/color/deployment-color.svg",
        "svgComplete": "ui/public/static/img/meshmodels/kubernetes/complete/deployment-complete.svg",
        "svgWhite": "ui/public/static/img/meshmodels/kubernetes/white/deployment-white.svg"
      },
      "capabilities": null,
      "status": "enabled",
      "metadata": {
        "configurationUISchema": "",
        "genealogy": "parent",
        "instanceDetails": null,
        "isAnnotation": false,
        "isNamespaced": true,
        "published": false,
        "source_uri": "git://github.com/kubernetes/kubernetes/master/api/openapi-spec/v3"
      },
      "configuration": {
        "metadata": {
          "annotations": {
            "provider": "kubernetes-sample-apps"
          },
          "name": "podinfo",
          "namespace": "podinfo"
        },
        "spec": {
          "minReadySeconds": 3,
          "progressDeadlineSeconds": 60,
          "revisionHistoryLimit": 5,
          "selector": {
            "matchLabels": {
              "app": "podinfo"
            }
          },
          "strategy": {
            "rollingUpdate": {
              "maxUnavailable": 0
            },
            "type": "RollingUpdate"
          },
          "template": {
            "metadata": {
              "annotations": {
                "prometheus.io/port": "9797",
                "prometheus.io/scrape": "true"
              },
              "labels": {
                "app": "podinfo"
              }
            },
            "spec": {
              "containers": [
                {
                  "command": [
                    "./podinfo",
                    "--port=9898",
                    "--port-metrics=9797",
                    "--grpc-port=9999",
                    "--grpc-service-name=podinfo",
                    "--level=info",
                    "--random-delay=false",
                    "--random-error=false"
                  ],
                  "env": [
                    {
                      "name": "PODINFO_UI_COLOR",
                      "value": "#34577c"
                    }
                  ],
                  "image": "ghcr.io/stefanprodan/podinfo:6.17.0",
                  "imagePullPolicy": "IfNotPresent",
                  "livenessProbe": {
                    "exec": {
                      "command": [
                        "podcli",
                        "check",
                        "http",
                        "localhost:9898/healthz"
                      ]
                    },
                    "initialDelaySeconds": 5,
                    "timeoutSeconds": 5
                  },
                  "name": "podinfod",
                  "ports": [
                    {
                      "containerPort": 9898,
                      "name": "http",
                      "protocol": "TCP"
                    },
                    {
                      "containerPort": 9797,
                      "name": "http-metrics",
                      "protocol": "TCP"
                    },
                    {
                      "containerPort": 9999,
                      "name": "grpc",
                      "protocol": "TCP"
                    }
                  ],
                  "readinessProbe": {
                    "exec": {
                      "command": [
                        "podcli",
                        "check",
                        "http",
                        "localhost:9898/readyz"
                      ]
                    },
                    "initialDelaySeconds": 5,
                    "timeoutSeconds": 5
                  },
                  "resources": {
                    "limits": {
                      "cpu": "2000m",
                      "memory": "512Mi"
                    },
                    "requests": {
                      "cpu": "100m",
                      "memory": "64Mi"
                    }
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/data",
                      "name": "data"
                    }
                  ]
                }
              ],
              "volumes": [
                {
                  "emptyDir": {},
                  "name": "data"
                }
              ]
            }
          }
        }
      },
