description: A Kubernetes-based AI application infrastructure architecture for building registry-grounded AI and RAG applications. The design includes an AI API, LLM Router, Ollama inference, RAG and embedding services, vector database, Redis cache, persistent storage, and Kubernetes configuration resources. It provides a structured foundation for deploying and connecting AI services in a cloud-native environment.
