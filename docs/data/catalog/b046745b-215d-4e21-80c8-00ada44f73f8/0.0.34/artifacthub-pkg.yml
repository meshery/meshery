readme: "This design is an architectural reference and may require configuration changes based on the target Kubernetes environment, AI providers, models, storage backend, and resource requirements. Ollama and other AI services require appropriate compute resources. Secrets and credentials should be supplied securely at deployment time and should not contain real credentials in the design. \n ##h4 Caveats and Consideration \n"
