version: 0.0.24
name: engineering-context-memory
displayName: engineering context memory
createdAt: "2026-10-21T06:22:38Z"
description: |-
    A source-traceable engineering memory system designed to preserve and retrieve institutional knowledge from GitLab repositories and merge-request discussions. The system uses context engineering to extract, classify, and store architectural decisions, technical constraints, known issues, and implementation rationale.
    By providing AI coding agents such as Claude Code with relevant historical context before code generation, the system aims to reduce repeated mistakes, prevent conflicting implementations, and address knowledge attrition across development teams.
    The architecture consists of GitLab ingestion workers, a memory retrieval API, and PostgreSQL with pgvector for persistent storage and semantic search. Deployed on Kubernetes, the system supports scalable knowledge ingestion and contextual retrieval.
