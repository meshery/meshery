      "configuration": {
        "metadata": {
          "name": "memory-postgres",
          "namespace": "engineering-memory"
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "memory-postgres"
            }
          },
          "serviceName": "memory-postgres",
          "template": {
            "metadata": {
              "labels": {
                "app": "memory-postgres"
              }
            },
            "spec": {
              "containers": [
                {
                  "env": [
                    {
                      "name": "POSTGRES_DB",
                      "value": "engineering_memory"
                    },
                    {
                      "name": "POSTGRES_USER",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "POSTGRES_USER",
                          "name": "memory-secrets"
                        }
                      }
                    },
                    {
                      "name": "POSTGRES_PASSWORD",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "POSTGRES_PASSWORD",
                          "name": "memory-secrets"
                        }
                      }
                    }
                  ],
                  "image": "pgvector/pgvector:pg17",
                  "name": "postgres",
                  "ports": [
                    {
                      "containerPort": 5432,
                      "name": "postgres"
                    }
                  ],
                  "readinessProbe": {
                    "exec": {
                      "command": [
                        "/bin/sh",
                        "-c",
                        "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
                      ]
                    },
                    "initialDelaySeconds": 5,
                    "periodSeconds": 10
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/var/lib/postgresql/data",
                      "name": "postgres-data",
                      "subPath": "pgdata"
                    }
                  ]
                }
              ]
            }
          },
          "volumeClaimTemplates": [
            {
              "metadata": {
                "name": "postgres-data"
              },
              "spec": {
                "accessModes": [
                  "ReadWriteOnce"
                ],
                "resources": {
                  "requests": {
                    "storage": "10Gi"
                  }
                }
              }
            }
          ]
        }
      },
