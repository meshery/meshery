description: A reference architecture for a load-balanced web application on AWS. An internet-facing Elastic Load Balancer distributes incoming traffic across two EC2 web servers deployed in separate Availability Zones, both of which connect to a managed RDS database for persistence. The design is organized inside a Kubernetes Namespace container and expresses the traffic flow, the multi-AZ redundancy pattern, and the containment hierarchy as Meshery relationships. Use it as a starting point for reviewing, adapting, or documenting a three-tier AWS topology before provisioning it with ACK, Terraform, or CloudFormation.
