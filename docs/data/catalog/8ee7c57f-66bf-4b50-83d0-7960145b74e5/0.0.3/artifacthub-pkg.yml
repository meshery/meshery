readme: "⚠️ This is a reference topology, not a deployable stack\nThe AWS components in this design are annotation-style components (isAnnotation: true) with placeholder configuration. Their configuration blocks carry only metadata.namespace: default — no AMI, instance type, subnet, listener, or target-group settings. Importing and deploying this design as-is will not provision real AWS infrastructure. It renders the intended architecture visually and structurally; turning it into running infrastructure requires populating each component's configuration (or exporting to Terraform/CloudFormation and completing the resource definitions there). \n ##h4 Caveats and Consideration \n"
