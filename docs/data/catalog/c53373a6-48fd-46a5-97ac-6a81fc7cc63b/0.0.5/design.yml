        },
        "name": "kubernetes",
        "registrant": {
          "kind": "github"
        },
        "version": "v1.0.0"
      },
      "styles": {
        "background-image": "none",
        "background-opacity": 0.5,
        "border-width": 2,
        "position": {
          "x": 644,
          "y": 597
        },
        "primaryColor": "#326CE5",
        "secondaryColor": "#7aa1f0",
        "shape": "round-rectangle",
        "svgColor": "ui/public/static/img/meshmodels/kubernetes/color/deployment-color.svg",
        "svgComplete": "ui/public/static/img/meshmodels/kubernetes/complete/deployment-complete.svg",
        "svgWhite": "ui/public/static/img/meshmodels/kubernetes/white/deployment-white.svg",
        "z-index": 9
      },
      "capabilities": null,
      "status": "enabled",
      "metadata": {
        "configurationUISchema": "",
        "genealogy": "",
        "instanceDetails": null,
        "isAnnotation": false,
        "isNamespaced": true,
        "published": false,
        "source_uri": "git://github.com/kubernetes/kubernetes/master/api/openapi-spec/v3"
      },
      "configuration": {
        "metadata": {
          "labels": {
            "app": "model-server"
          },
          "name": "model-server",
          "namespace": "ml-serving"
        },
        "spec": {
          "replicas": 2,
          "selector": {
            "matchLabels": {
              "app": "model-server"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "model-server"
              }
            },
            "spec": {
              "containers": [
                {
                  "image": "seldonio/mlserver:1.6.1-sklearn",
                  "livenessProbe": {
                    "httpGet": {
                      "path": "/v2/health/live",
                      "port": "http"
                    },
                    "initialDelaySeconds": 30,
                    "periodSeconds": 20
                  },
                  "name": "mlserver",
                  "ports": [
                    {
                      "containerPort": 8080,
                      "name": "http"
                    },
                    {
                      "containerPort": 8081,
                      "name": "grpc"
                    },
                    {
                      "containerPort": 8082,
                      "name": "metrics"
                    }
                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/v2/health/ready",
                      "port": "http"
                    },
                    "initialDelaySeconds": 15,
                    "periodSeconds": 10
                  },
                  "resources": {
                    "limits": {
                      "cpu": "1",
                      "memory": "1Gi"
                    },
                    "requests": {
                      "cpu": "250m",
                      "memory": "512Mi"
                    }
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/mnt/models",
                      "name": "models"
                    }
                  ]
                }
              ],
              "initContainers": [
                {
                  "args": [
                    "mc alias set store \"$MINIO_ENDPOINT\" \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\" \u0026\u0026 mc mb --ignore-existing \"store/$MODEL_BUCKET\" \u0026\u0026 mc mirror \"store/$MODEL_BUCKET\" /mnt/models\n"
                  ],
                  "command": [
                    "/bin/sh",
                    "-c"
                  ],
                  "envFrom": [
                    {
                      "secretRef": {
                        "name": "minio-credentials"
                      }
                    },
                    {
                      "configMapRef": {
                        "name": "model-server-config"
                      }
                    }
                  ],
                  "image": "minio/mc:latest",
                  "name": "fetch-models",
                  "volumeMounts": [
                    {
                      "mountPath": "/mnt/models",
                      "name": "models"
                    }
                  ]
                }
              ],
              "serviceAccountName": "model-server",
              "volumes": [
                {
                  "emptyDir": {},
                  "name": "models"
                }
              ]
            }
          }
        }
      },
