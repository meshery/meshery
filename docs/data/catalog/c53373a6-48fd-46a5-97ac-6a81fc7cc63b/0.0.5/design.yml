                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/minio/health/ready",
                      "port": "api"
                    },
                    "initialDelaySeconds": 10,
                    "periodSeconds": 10
                  },
                  "resources": {
                    "limits": {
                      "cpu": "500m",
                      "memory": "512Mi"
                    },
                    "requests": {
                      "cpu": "100m",
                      "memory": "256Mi"
                    }
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/data",
                      "name": "data"
                    }
                  ]
                }
              ],
              "volumes": [
                {
                  "name": "data",
                  "persistentVolumeClaim": {
                    "claimName": "minio-data"
                  }
                }
              ]
            }
          }
        }
