      "configuration": {
        "metadata": {
          "labels": {
            "app": "prometheus"
          },
          "name": "prometheus",
          "namespace": "ml-serving"
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "prometheus"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "prometheus"
              }
            },
            "spec": {
              "containers": [
                {
                  "args": [
                    "--config.file=/etc/prometheus/prometheus.yml"
                  ],
                  "image": "prom/prometheus:v2.53.0",
                  "name": "prometheus",
                  "ports": [
                    {
                      "containerPort": 9090,
                      "name": "web"
                    }
                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/-/ready",
                      "port": "web"
                    }
                  },
                  "resources": {
                    "limits": {
                      "cpu": "500m",
                      "memory": "512Mi"
                    },
                    "requests": {
                      "cpu": "100m",
                      "memory": "256Mi"
                    }
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/etc/prometheus",
                      "name": "config"
                    }
                  ]
                }
              ],
              "volumes": [
                {
                  "configMap": {
                    "name": "prometheus-config"
                  },
                  "name": "config"
                }
              ]
            }
          }
        }
