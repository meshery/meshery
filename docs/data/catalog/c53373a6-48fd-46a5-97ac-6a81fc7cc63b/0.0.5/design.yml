          },
          "name": "minio",
          "namespace": "ml-serving"
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "minio"
            }
          },
          "strategy": {
            "type": "Recreate"
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "minio"
              }
            },
            "spec": {
              "containers": [
                {
                  "args": [
                    "server",
                    "/data",
                    "--console-address",
                    ":9001"
                  ],
                  "envFrom": [
                    {
                      "secretRef": {
                        "name": "minio-credentials"
                      }
