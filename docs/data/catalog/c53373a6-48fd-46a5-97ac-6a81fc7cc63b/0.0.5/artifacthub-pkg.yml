version: 0.0.5
name: ml-model-serving-stack
displayName: ML Model Serving Stack
createdAt: "2026-11-15T04:44:00Z"
description: A production-minded reference architecture for serving machine learning models on Kubernetes. Inference requests enter through an Ingress and are routed to MLServer, which runs two replicas behind a Service, scales on CPU with a HorizontalPodAutoscaler, and is protected by a PodDisruptionBudget. On startup, an init container pulls model artifacts from a MinIO bucket backed by a PersistentVolumeClaim. A NetworkPolicy restricts MinIO access to the model server only, credentials are held in a Secret, and Prometheus scrapes MLServer's metrics endpoint. All workloads define resource limits and health probes.
logoURL: https://raw.githubusercontent.com/meshery/meshery.io/0b8585231c6e2b3251d38f749259360491c9ee6b/assets/images/brand/meshery-logo.svg
