readme: "1. Replace the placeholder MinIO credentials in the Secret before deploying.\n2. Upload a model to the \"models\" bucket; the server starts with an empty repository otherwise.\n3. Requires an Ingress controller, a default StorageClass, metrics-server (for the HPA), and a CNI that enforces NetworkPolicy.\n4. The Ingress host (ml.example.local) is a placeholder; set your own host and TLS.\n5. MinIO runs as a single replica and Prometheus has no persistent storage; both are for demonstration, not high availability.\n6. The MLServer image includes the scikit-learn runtime; change the image tag for other frameworks. \n ##h4 Caveats and Consideration \n"
install: mesheryctl design import -f
