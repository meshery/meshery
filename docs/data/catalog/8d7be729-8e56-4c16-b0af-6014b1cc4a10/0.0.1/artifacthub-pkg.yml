readme: "Deploy with: mesheryctl design import -f design.yml, then deploy from Meshery UI. Prerequisite: install the Prometheus CRD first (kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheuses.yaml) — the Prometheus custom resource cannot be created without it. The design deploys the operator (1 replica), a 2-replica Prometheus instance, its RBAC (ServiceAccount, ClusterRole, ClusterRoleBinding) and an ssd StorageClass. To add scrape targets, create a ServiceMonitor labeled team: frontend. The Prometheus ServiceMonitor for the operator itself and the persisted-Prometheus storage variant are not in this design; see the operator example for those. \n ##h4 Caveats and Consideration \n"
install: mesheryctl design import -f
