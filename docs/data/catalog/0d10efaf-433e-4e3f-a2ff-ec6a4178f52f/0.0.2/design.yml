            "app": "kratos-ai",
            "tier": "ml-service"
          },
          "name": "kratos-fastapi-service"
        },
        "spec": {
          "replicas": 2,
          "selector": {
            "matchLabels": {
              "app": "kratos-ai",
              "tier": "ml-service"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "kratos-ai",
                "tier": "ml-service"
              }
            },
            "spec": {
              "containers": [
                {
                  "env": [
                    {
                      "name": "REDIS_URL",
                      "value": "redis://kratos-redis:6379"
                    },
                    {
                      "name": "MODEL_PATH",
                      "value": "/models/lstm-gru-encoder.pt"
                    },
                    {
                      "name": "FINBERT_MODEL_PATH",
                      "value": "/models/finbert"
                    }
                  ],
                  "image": "kratos-ai/fastapi-service:latest",
                  "name": "fastapi-service",
                  "ports": [
                    {
                      "containerPort": 8000
                    }
                  ],
                  "resources": {
                    "limits": {
                      "cpu": "1",
                      "memory": "2Gi"
                    },
                    "requests": {
                      "cpu": "500m",
                      "memory": "1Gi"
                    }
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/models",
                      "name": "model-store"
                    }
                  ]
                }
              ],
              "volumes": [
                {
                  "name": "model-store",
                  "persistentVolumeClaim": {
                    "claimName": "kratos-model-pvc"
                  }
                }
              ]
            }
          }
        }
