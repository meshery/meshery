      "configuration": {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "metadata": {
          "labels": {
            "app": "kratos-ai",
            "tier": "gateway"
          },
          "name": "kratos-node-gateway"
        },
        "spec": {
          "replicas": 2,
          "selector": {
            "matchLabels": {
              "app": "kratos-ai",
              "tier": "gateway"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "kratos-ai",
                "tier": "gateway"
              }
            },
            "spec": {
              "containers": [
                {
                  "env": [
                    {
                      "name": "FASTAPI_SERVICE_URL",
                      "value": "http://kratos-fastapi-service:8000"
                    },
                    {
                      "name": "REDIS_URL",
                      "value": "redis://kratos-redis:6379"
                    },
                    {
                      "name": "MONGODB_URI",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "mongodb-uri",
                          "name": "kratos-secrets"
                        }
                      }
                    }
                  ],
                  "image": "kratos-ai/node-gateway:latest",
                  "name": "node-gateway",
                  "ports": [
                    {
                      "containerPort": 4000
                    }
                  ],
                  "resources": {
                    "limits": {
                      "cpu": "500m",
                      "memory": "512Mi"
                    },
                    "requests": {
                      "cpu": "250m",
                      "memory": "256Mi"
                    }
                  }
                }
              ]
            }
          }
        }
      },
