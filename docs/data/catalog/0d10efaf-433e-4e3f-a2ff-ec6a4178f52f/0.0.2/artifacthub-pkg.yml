name: kratos.ai
displayName: Kratos.ai
createdAt: "2026-08-18T11:32:55Z"
description: Kubernetes deployment design for Kratos.ai, an intelligent market intelligence platform. Includes a Node.js API gateway (portfolio management, trading simulation, live P&L tracking), an async FastAPI ML service running an LSTM/GRU PyTorch encoder and FinBERT for market regime detection (Stable Growth, Volatile, Crisis) with confidence scoring, and a Redis cache layer. MongoDB Atlas is used as the external data store and is not deployed in-cluster.
