readme: "MongoDB connection is external (Atlas) — the Secret in this design is a placeholder and must be replaced with a real connection string or wired through Meshery Connections/Credentials before deploy.\nRedis runs as a single replica with no persistence configured — cache loss on pod restart is expected; not suitable as a source of truth.\nThe FastAPI service assumes model artifacts (LSTM/GRU encoder, FinBERT) are pre-loaded onto the mounted PVC (kratos-model-pvc); the design does not include a model-sync/init step.\nNo GPU resource requests are defined for the ML service — PyTorch inference will run on CPU unless you add nvidia.com/gpu limits and a compatible node pool.\nResource requests/limits (CPU, memory, storage) are placeholder values and haven't been load-tested against real inference throughput.\nNo liveness/readiness probes, HPA, NetworkPolicy, or Ingress are defined — this design is deploy-ready for a dev/staging cluster, not production-hardened.\nImage references (kratos-ai/node-gateway: latest, kratos-ai/fastapi-service: latest) are placeholders — replace with your actual registry paths and pin to a specific tag rather than latest. \n ##h4 Caveats and Consideration \n"
install: mesheryctl design import -f
