                      }
                    },
                    {
                      "name": "MYSQL_ROOT_PASSWORD",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "mysql-root-password",
                          "name": "wordpress-db-credentials"
                        }
                      }
                    }
                  ],
                  "image": "mysql:8.4",
                  "name": "mysql",
                  "ports": [
                    {
                      "containerPort": 3306,
