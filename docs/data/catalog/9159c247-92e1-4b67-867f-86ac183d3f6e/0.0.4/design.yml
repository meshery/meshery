            "spec": {
              "containers": [
                {
                  "env": [
                    {
                      "name": "MYSQL_DATABASE",
                      "value": "wordpress"
                    },
                    {
                      "name": "MYSQL_USER",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "database-user",
