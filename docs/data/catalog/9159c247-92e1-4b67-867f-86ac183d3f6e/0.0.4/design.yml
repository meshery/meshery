                        }
                      }
                    }
                  ],
                  "envFrom": [
                    {
                      "configMapRef": {
                        "name": "wordpress-config"
                      }
                    }
                  ],
                  "image": "wordpress:6.6-apache",
                  "livenessProbe": {
                    "httpGet": {
                      "path": "/wp-login.php",
                      "port": "http"
                    },
                    "initialDelaySeconds": 60,
                    "periodSeconds": 20
                  },
                  "name": "wordpress",
                  "ports": [
                    {
                      "containerPort": 80,
                      "name": "http"
                    }
                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/wp-login.php",
                      "port": "http"
                    },
                    "initialDelaySeconds": 20,
                    "periodSeconds": 10
                  },
                  "resources": {
                    "limits": {
                      "cpu": "1",
                      "memory": "768Mi"
                    },
                    "requests": {
                      "cpu": "250m",
                      "memory": "256Mi"
                    }
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/var/www/html",
                      "name": "content"
                    }
                  ]
                }
              ],
              "volumes": [
                {
                  "name": "content",
                  "persistentVolumeClaim": {
                    "claimName": "wordpress-content"
                  }
                }
              ]
            }
          }
        }
