          "name": "wordpress",
          "namespace": "wordpress"
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app.kubernetes.io/name": "wordpress"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app.kubernetes.io/name": "wordpress"
              }
            },
            "spec": {
              "containers": [
                {
                  "env": [
                    {
                      "name": "WORDPRESS_DB_USER",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "database-user",
                          "name": "wordpress-db-credentials"
                        }
                      }
                    },
                    {
                      "name": "WORDPRESS_DB_PASSWORD",
                      "valueFrom": {
                        "secretKeyRef": {
