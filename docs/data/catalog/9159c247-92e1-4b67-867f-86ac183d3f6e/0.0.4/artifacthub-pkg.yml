description: A Kubernetes WordPress site backed by MySQL. The design groups resources in a dedicated namespace and includes an Ingress, WordPress Service and Deployment, MySQL Service and StatefulSet, persistent volume claims, ConfigMap, Secret, and a NetworkPolicy intended to restrict database ingress to WordPress pods. Prepared with AI assistance and checked in Meshery Kanvas; its design validator reported zero errors. It has not been deployed to a cluster.
