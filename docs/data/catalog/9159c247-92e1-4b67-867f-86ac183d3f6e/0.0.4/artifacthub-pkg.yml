readme: "This is an illustrative starting point, not a production deployment. Replace sample Secret values before use; configure TLS, StorageClass and storage sizing, database backups, resource requests and limits, and appropriate health probes for your environment. Review the NetworkPolicy against your CNI and confirm the ingress class and host. No live cluster or runtime testing has been performed. AI assistance was used in preparing the manifest and description. \n ##h4 Caveats and Consideration \n"
