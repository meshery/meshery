readme: "- The target Kubernetes namespace `playground-sandbox` must exist before deployment.\n- The user or service account must have permission to create Deployments in the target namespace.\n- The design creates a Deployment only; it does not include a Kubernetes Service or Ingress for external access.\n- The NGINX container image must be accessible from the Kubernetes cluster. \n ##h4 Caveats and Consideration \n"
install: mesheryctl design import -f
