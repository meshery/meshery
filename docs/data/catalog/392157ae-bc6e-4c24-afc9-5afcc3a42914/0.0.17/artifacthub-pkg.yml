version: 0.0.17
name: rajendhar-kubernetes-deployment-design
displayName: Rajendhar Kubernetes Deployment Design
createdAt: "2026-11-19T11:08:26Z"
description: |-
    A simple Kubernetes Deployment design that demonstrates how to run an NGINX web server using a declarative configuration in Meshery Kanvas. The design creates two replicas of the NGINX container using the `nginx:1.27` image in the `playground-sandbox` namespace.

    This design is intended as a beginner-friendly reference for understanding Kubernetes Deployments, container image configuration, replica management, and namespace selection. It was validated successfully using Meshery Playground's Dryrun feature.
