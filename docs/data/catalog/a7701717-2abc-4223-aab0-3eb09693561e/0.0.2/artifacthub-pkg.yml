readme: "Requires metrics-server. The HPA cannot function without metrics-server installed in the cluster, because it depends on the resource metrics API to read CPU utilization. Most managed clusters (EKS, GKE, AKS) include it by default; kind and minikube may require enabling the metrics-server addon manually. Without it, the HPA will report <unknown> metrics and will not scale.\n\nThe image is a placeholder. nginx:1.27-alpine is used to demonstrate the pattern. Replace it with your actual application image and adjust resources.requests.cpu accordingly — HPA CPU targets are calculated as a percentage of the requested CPU, so a missing or too-small request value will distort scaling behaviour.\n\nCPU is a proxy metric. This HPA scales on CPU utilization. Applications that are I/O-bound, queue-depth-bound, or memory-bound should use custom or external metrics instead of — or in addition to — CPU. The design is intentionally minimal; adding custom metrics requires Prometheus or another metrics adapter. \n ##h4 Caveats and Consideration \n"
install: mesheryctl design import -f
