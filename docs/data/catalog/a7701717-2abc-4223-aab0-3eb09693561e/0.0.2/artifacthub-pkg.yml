version: 0.0.2
name: autoscaling-demo
displayName: autoscaling-demo
createdAt: "2026-10-23T09:49:06Z"
description: 'A horizontally auto-scaling Kubernetes web application. A Deployment runs the web tier behind a ClusterIP Service, while a HorizontalPodAutoscaler dynamically adjusts replicas between 2 and 10 based on CPU utilization. All resources live in a dedicated Namespace. This pattern demonstrates Kubernetes-native elasticity with minimal component count: traffic scales with demand, failed pods are replaced automatically, and idle load collapses back to the two-replica floor. It runs on any conformant Kubernetes cluster, including EKS, GKE, AKS, kind, and minikube.'
