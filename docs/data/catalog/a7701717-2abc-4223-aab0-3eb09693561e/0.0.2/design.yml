        "isNamespaced": true,
        "published": false
      },
      "configuration": {
        "apiVersion": "autoscaling/v2",
        "kind": "HorizontalPodAutoscaler",
        "metadata": {
          "name": "webapp-hpa",
          "namespace": "autoscaling-demo"
        },
        "spec": {
          "maxReplicas": 10,
          "metrics": [
            {
              "resource": {
                "name": "cpu",
                "target": {
                  "averageUtilization": 70,
                  "type": "Utilization"
                }
              },
              "type": "Resource"
            }
          ],
          "minReplicas": 2,
          "scaleTargetRef": {
            "apiVersion": "apps/v1",
            "kind": "Deployment",
            "name": "webapp"
          }
        }
      },
