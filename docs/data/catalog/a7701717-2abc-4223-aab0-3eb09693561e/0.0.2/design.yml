        "published": false
      },
      "configuration": {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "metadata": {
          "labels": {
            "app": "webapp"
          },
          "name": "webapp",
          "namespace": "autoscaling-demo"
        },
        "spec": {
          "replicas": 2,
          "selector": {
            "matchLabels": {
              "app": "webapp"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "webapp"
              }
            },
            "spec": {
              "containers": [
                {
                  "image": "nginx:1.27-alpine",
                  "name": "web",
                  "ports": [
                    {
                      "containerPort": 80
                    }
                  ],
                  "resources": {
                    "limits": {
                      "cpu": "500m",
                      "memory": "256Mi"
                    },
                    "requests": {
                      "cpu": "100m",
                      "memory": "128Mi"
                    }
                  }
                }
              ]
            }
          }
        }
      },
      "component": {
        "version": "v1",
