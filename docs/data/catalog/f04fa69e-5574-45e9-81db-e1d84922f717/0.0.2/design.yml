        "metadata": {
          "labels": {
            "app": "web",
            "track": "stable"
          },
          "name": "web-stable",
          "namespace": "progressive-demo"
        },
        "spec": {
          "replicas": 3,
          "selector": {
            "matchLabels": {
              "app": "web",
              "track": "stable"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "web",
                "track": "stable"
              }
            },
            "spec": {
              "containers": [
                {
                  "image": "argoproj/rollouts-demo:blue",
                  "name": "web",
                  "ports": [
                    {
                      "containerPort": 8080,
                      "name": "http"
                    }
                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/",
                      "port": "http"
                    }
                  },
                  "resources": {
                    "limits": {
                      "cpu": "250m",
                      "memory": "128Mi"
                    },
                    "requests": {
                      "cpu": "100m",
                      "memory": "64Mi"
                    }
