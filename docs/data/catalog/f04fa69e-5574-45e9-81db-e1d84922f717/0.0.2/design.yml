      "displayName": "require-resource-limits",
      "description": "",
      "format": "",
      "model": null,
      "modelReference": {
        "displayName": "Kyverno",
        "id": "00000000-0000-0000-0000-000000000000",
        "model": {
          "version": "v1.20.0-rc.5"
        },
        "name": "kyverno",
        "registrant": {
          "kind": "github"
        },
        "version": "v1.0.0"
      },
      "styles": {
        "primaryColor": "#e77e5b",
        "secondaryColor": "#e77e5b",
        "shape": "shield",
        "svgColor": "ui/public/static/img/meshmodels/kyverno/color/clusterpolicy-color.svg",
        "svgComplete": "",
        "svgWhite": "ui/public/static/img/meshmodels/kyverno/white/clusterpolicy-white.svg"
      },
      "capabilities": null,
      "status": "enabled",
      "metadata": {
        "configurationUISchema": "",
        "genealogy": "",
        "instanceDetails": null,
        "isAnnotation": false,
        "isNamespaced": false,
        "published": false,
        "source_uri": "git://github.com/kyverno/kyverno/main/config/crds/kyverno"
      },
      "configuration": {
        "metadata": {
          "annotations": {
            "policies.kyverno.io/description": "Pods in progressive-demo must set CPU and memory limits.",
            "policies.kyverno.io/title": "Require resource limits"
          },
          "name": "require-resource-limits"
        },
        "spec": {
          "background": true,
          "rules": [
            {
              "match": {
                "any": [
                  {
                    "resources": {
                      "kinds": [
                        "Pod"
                      ],
                      "namespaces": [
                        "progressive-demo"
                      ]
                    }
                  }
                ]
              },
              "name": "require-cpu-and-memory-limits",
              "validate": {
                "cel": {
                  "expressions": [
                    {
                      "expression": "object.spec.containers.all(c, has(c.resources) \u0026\u0026 has(c.resources.limits) \u0026\u0026 has(c.resources.limits.cpu) \u0026\u0026 has(c.resources.limits.memory))",
                      "message": "CPU and memory limits are required for every container."
                    }
                  ]
                }
              }
            }
          ],
          "validationFailureAction": "Enforce"
        }
      },
      "component": {
        "version": "kyverno.io/v1",
        "kind": "ClusterPolicy",
        "schema": ""
      },
      "created_at": "0001-01-01T00:00:00Z",
      "updated_at": "0001-01-01T00:00:00Z"
    },
