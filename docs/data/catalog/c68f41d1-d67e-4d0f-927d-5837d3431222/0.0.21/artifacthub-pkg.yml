description: SentinelFlow is a resilient AI inference platform designed as a cloud-native Kubernetes architecture. It combines an API layer, inference routing, model serving, asynchronous workers, Redis, PostgreSQL, Kafka, and an OpenTelemetry-based observability stack. The design demonstrates scalable inference workloads, service-to-service communication, autoscaling, disruption protection, and network-level security controls.
