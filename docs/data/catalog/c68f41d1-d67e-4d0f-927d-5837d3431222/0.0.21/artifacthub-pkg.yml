readme: "This design is intended as a reference architecture and visual demonstration of Kubernetes-based AI infrastructure. Container images, credentials, storage classes, ingress configuration, and environment-specific networking should be reviewed and replaced before production deployment. Resource limits, persistent storage, secrets management, and observability retention should be tuned according to workload requirements. \n ##h4 Caveats and Consideration \n"
