        "isNamespaced": true,
        "published": false,
        "source_uri": "git://github.com/kubernetes/kubernetes/master/api/openapi-spec/v3"
      },
      "configuration": {
        "metadata": {
          "name": "model-refresh",
          "namespace": "sentinelflow"
        },
        "spec": {
          "concurrencyPolicy": "Forbid",
          "failedJobsHistoryLimit": 3,
          "jobTemplate": {
            "spec": {
              "template": {
                "metadata": {
                  "labels": {
                    "app": "model-refresh",
                    "tier": "batch"
                  }
                },
                "spec": {
                  "containers": [
                    {
                      "args": [
                        "echo \"refreshing model metadata and cache\"; sleep 5"
                      ],
                      "command": [
                        "/bin/sh",
                        "-c"
                      ],
                      "image": "alpine:3.20",
                      "name": "refresh",
                      "resources": {
                        "limits": {
                          "cpu": "200m",
                          "memory": "128Mi"
                        },
                        "requests": {
                          "cpu": "50m",
                          "memory": "64Mi"
                        }
                      }
                    }
                  ],
                  "restartPolicy": "OnFailure"
                }
              }
            }
          },
          "schedule": "0 */6 * * *",
          "successfulJobsHistoryLimit": 2
        }
      },
      "component": {
        "version": "batch/v1",
        "kind": "CronJob",
        "schema": ""
      },
