readme: "Deploy with: mesheryctl design import -f design.yml, then deploy from Meshery UI. The frontend Service is type LoadBalancer — on a local cluster use kubectl port-forward svc/frontend 8080:80. Redis leader is the single writer; followers replicate reads. Data is ephemeral unless you add a PersistentVolume. \n ##h4 Caveats and Consideration \n"
