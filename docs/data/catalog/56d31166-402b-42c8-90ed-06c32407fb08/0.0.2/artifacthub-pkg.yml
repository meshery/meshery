readme: "1. Ingress Controller: Requires an active Ingress Controller (such as NGINX Ingress Controller) running in the cluster to route incoming external traffic.            \n2. Redis Persistence: The Redis broker currently uses ephemeral storage optimized for caching and real-time pub/sub messaging. For durable chat history, attach a PersistentVolumeClaim (PVC) or convert to a StatefulSet.\n3. WebSocket Scaling: Ensure the Ingress Controller is configured with WebSocket proxy support and session affinity (sticky sessions) if long-lived socket connections are maintained across pod replicas. \n ##h4 Caveats and Consideration \n"
install: mesheryctl design import -f
