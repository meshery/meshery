description: A scalable, cloud-native real-time chat application architecture built on Kubernetes. It features a stateless Node.js backend running across multiple replicas, an Ingress Load Balancer for routing external HTTP/WebSocket traffic, a Redis broker for pub/sub message broadcasting across pods, and externalized environment configuration via ConfigMaps.
