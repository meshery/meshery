readme: "This is a minimal, educational design intended to demonstrate Kubernetes Service-mediated communication patterns. The Deployment components do not include a Selector, Pod Template, or container image — they are placeholders for illustrating architecture and connectivity, not a deployable production configuration. To actually deploy this design to a cluster, each Deployment would need a valid selector, pod template (container image, ports, resource limits), and the Services would need matching selectors and target ports. \n ##h4 Caveats and Consideration \n"
install: mesheryctl design import -f
