version: 0.0.65
name: simple-3tier-app
displayName: simple-3tier-app
createdAt: "2026-08-26T13:11:06Z"
description: 'A minimal three-tier cloud native application pattern demonstrating core Kubernetes communication design: a frontend Deployment, an api Deployment, and a database Deployment, each fronted by its own Service (frontend-svc, api-svc, db-svc). The design illustrates how Kubernetes workloads communicate indirectly through Services rather than directly by Pod IP — frontend-svc routes to api-svc, which routes to db-svc — mirroring a typical request flow from user-facing UI through business logic to data storage. Intended as a beginner-friendly reference for understanding service-to-service networking patterns in Kubernetes and how Meshery visualizes them.'
logoURL: https://raw.githubusercontent.com/meshery/meshery.io/0b8585231c6e2b3251d38f749259360491c9ee6b/assets/images/brand/meshery-logo.svg
