readme: "This is a sample application intended for learning and demonstration, not production use. It requires a Kubernetes cluster and access to the public Istio Bookinfo container images. The Services are ClusterIP by default, so access to productpage requires port-forwarding or an appropriate ingress or load balancer configuration. The manifests do not include the optional Istio Gateway or DestinationRule resources. \n ##h4 Caveats and Consideration \n"
