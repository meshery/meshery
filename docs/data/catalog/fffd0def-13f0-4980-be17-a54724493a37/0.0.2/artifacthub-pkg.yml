readme: "This sample is intended for learning and demonstration, not production use. It requires a Kubernetes cluster and access to the public container images. The manifests use demo credentials that must not be reused in production. The storefront and admin Services use LoadBalancer and require cluster support or an alternative exposure method. The optional AI service is not included in this manifest, so AI-powered features will not be available. \n ##h4 Caveats and Consideration \n"
