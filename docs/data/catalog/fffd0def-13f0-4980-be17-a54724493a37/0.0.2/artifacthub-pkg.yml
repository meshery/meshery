description: AKS Store Demo is a microservices-based e-commerce application that demonstrates a cloud-native online store architecture. It includes a storefront, admin interface, product and order services, background customer and worker services, and supporting RabbitMQ and DocumentDB databases. It showcases Kubernetes Deployments, StatefulSets, Services, ConfigMaps, Secrets, and inter-service communication.
