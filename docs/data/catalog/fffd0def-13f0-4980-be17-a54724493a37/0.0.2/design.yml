        },
        "name": "kubernetes",
        "registrant": {
          "kind": "github"
        },
        "version": "v1.0.0"
      },
      "styles": {
        "background-image": "none",
        "background-opacity": 0.5,
        "border-width": 2,
        "primaryColor": "#326CE5",
        "secondaryColor": "#7aa1f0",
        "shape": "round-rectangle",
        "svgColor": "ui/public/static/img/meshmodels/kubernetes/color/deployment-color.svg",
        "svgComplete": "ui/public/static/img/meshmodels/kubernetes/complete/deployment-complete.svg",
        "svgWhite": "ui/public/static/img/meshmodels/kubernetes/white/deployment-white.svg"
      },
      "capabilities": null,
      "status": "enabled",
      "metadata": {
        "configurationUISchema": "",
        "genealogy": "parent",
        "instanceDetails": null,
        "isAnnotation": false,
        "isNamespaced": true,
        "published": false,
        "source_uri": "git://github.com/kubernetes/kubernetes/master/api/openapi-spec/v3"
      },
      "configuration": {
        "metadata": {
          "name": "order-service"
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "order-service"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "order-service"
              }
            },
            "spec": {
              "containers": [
                {
                  "envFrom": [
                    {
                      "configMapRef": {
                        "name": "order-service-configs"
                      }
                    },
                    {
                      "secretRef": {
                        "name": "order-service-secrets"
                      }
                    }
                  ],
                  "image": "ghcr.io/azure-samples/aks-store-demo/order-service:2.2.0",
                  "livenessProbe": {
                    "failureThreshold": 5,
                    "httpGet": {
                      "path": "/health",
                      "port": 3000
                    },
                    "initialDelaySeconds": 3,
                    "periodSeconds": 3
                  },
                  "name": "order-service",
                  "ports": [
                    {
                      "containerPort": 3000
                    }
                  ],
                  "readinessProbe": {
                    "failureThreshold": 3,
                    "httpGet": {
                      "path": "/health",
                      "port": 3000
                    },
                    "initialDelaySeconds": 3,
                    "periodSeconds": 5
                  },
                  "resources": {
                    "limits": {
                      "cpu": "100m",
                      "memory": "256Mi"
                    },
                    "requests": {
                      "cpu": "1m",
                      "memory": "50Mi"
                    }
                  },
                  "startupProbe": {
                    "failureThreshold": 5,
                    "httpGet": {
                      "path": "/health",
                      "port": 3000
                    },
                    "initialDelaySeconds": 20,
                    "periodSeconds": 10
                  }
                }
              ],
              "initContainers": [
                {
                  "command": [
                    "sh",
                    "-c",
                    "until nc -zv rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;"
                  ],
                  "image": "busybox:1.37.0",
                  "name": "wait-for-rabbitmq",
                  "resources": {
                    "limits": {
                      "cpu": "100m",
                      "memory": "256Mi"
                    },
                    "requests": {
                      "cpu": "1m",
                      "memory": "50Mi"
                    }
                  }
                }
              ],
              "nodeSelector": {
                "kubernetes.io/os": "linux"
              }
            }
          }
        }
      },
