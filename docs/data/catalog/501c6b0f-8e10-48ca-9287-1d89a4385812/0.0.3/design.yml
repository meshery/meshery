    {
      "id": "fcda8495-f122-4234-8ce5-e0406c1411d1",
      "schemaVersion": "components.meshery.io/v1beta2",
      "version": "v1.0.0",
      "displayName": "stateful-set-postgres",
      "description": "",
      "format": "",
      "model": null,
      "modelReference": {
        "displayName": "Kubernetes",
        "id": "00000000-0000-0000-0000-000000000000",
        "model": {
          "version": "v1.38.0-alpha.2"
        },
        "name": "kubernetes",
        "registrant": {
          "kind": "github"
        },
        "version": "v1.0.0"
      },
      "styles": {
        "background-opacity": 0.2,
        "height": 15,
        "position": {
          "x": 1094.5783083367032,
          "y": 2635.5305822547225
        },
        "primaryColor": "#326CE5",
        "secondaryColor": "#7aa1f0",
        "shape": "round-rectangle",
        "svgColor": "ui/public/static/img/meshmodels/kubernetes/color/statefulset-color.svg",
        "svgComplete": "ui/public/static/img/meshmodels/kubernetes/complete/statefulset-complete.svg",
        "svgWhite": "ui/public/static/img/meshmodels/kubernetes/white/statefulset-white.svg",
        "width": 15,
        "x": 12,
        "y": 20,
        "z-index": 6
      },
      "capabilities": null,
      "status": "enabled",
      "metadata": {
        "configurationUISchema": "",
        "genealogy": "parent",
        "instanceDetails": null,
        "isAnnotation": false,
        "isNamespaced": true,
        "published": false,
        "source_uri": "git://github.com/kubernetes/kubernetes/master/api/openapi-spec/v3"
      },
      "configuration": {
        "metadata": {
          "name": "stateful-set-postgres",
          "namespace": "devops-platform"
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "postgres"
            }
          },
          "serviceName": "service-postgres",
          "template": {
            "metadata": {
              "labels": {
                "app": "postgres"
              }
            },
            "spec": {
              "containers": [
                {
                  "env": [
                    {
                      "name": "POSTGRES_DB",
                      "value": "appdb"
                    },
                    {
                      "name": "POSTGRES_USER",
                      "value": "appuser"
                    },
                    {
                      "name": "POSTGRES_PASSWORD",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "POSTGRES_PASSWORD",
                          "name": "postgres-secret"
                        }
                      }
                    }
                  ],
                  "image": "postgres:16",
                  "name": "postgres",
                  "ports": [
                    {
                      "containerPort": 5432,
                      "protocol": "TCP"
                    }
                  ],
                  "volumeMounts": [
                    {
                      "mountPath": "/var/lib/postgresql/data",
                      "name": "postgres-data"
                    }
                  ]
                }
              ],
              "volumes": [
                {
                  "name": "postgres-data",
                  "persistentVolumeClaim": {
                    "claimName": "postgres-data"
                  }
                }
              ]
            }
          }
        }
      },
      "component": {
        "version": "apps/v1",
        "kind": "StatefulSet",
        "schema": ""
      },
      "created_at": "0001-01-01T00:00:00Z",
      "updated_at": "0001-01-01T00:00:00Z"
