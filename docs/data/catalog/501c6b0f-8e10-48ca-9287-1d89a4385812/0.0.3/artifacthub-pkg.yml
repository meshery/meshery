version: 0.0.3
name: cloud-native-web-application-v2
displayName: Cloud-Native Web Application v2
createdAt: "2026-10-18T17:52:45Z"
description: |-
    A cloud-native web application architecture designed with Kubernetes and Meshery. The design deploys a frontend (Nginx) and a backend (Node.js) in a dedicated namespace, each exposed through its own Service. PostgreSQL runs as a StatefulSet with a headless Service and a PersistentVolumeClaim for persistent storage. The database password is stored in a Kubernetes Secret instead of being written in plain text.

    This design demonstrates core Kubernetes concepts: namespaces, workload management, service exposure, application separation, secrets management, database deployment and persistent storage.
