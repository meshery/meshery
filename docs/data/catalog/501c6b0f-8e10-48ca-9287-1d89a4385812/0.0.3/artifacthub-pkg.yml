readme: "- This is a learning and demonstration design, not production-ready.\n- The Secret contains a placeholder password (change-me). Replace it with a secure value before any real deployment.\n- The backend runs a minimal Node.js HTTP server for demonstration. Replace it with your own application image.\n- The frontend uses the default Nginx image and serves its default page.\n- The PersistentVolumeClaim requests 5Gi with ReadWriteOnce and relies on a default StorageClass being available in the cluster.\n- Services are not exposed outside the cluster. Add an Ingress or a LoadBalancer Service for external access.\n- No resource limits, probes or network policies are defined yet. \n ##h4 Caveats and Consideration \n"
install: mesheryctl design import -f
