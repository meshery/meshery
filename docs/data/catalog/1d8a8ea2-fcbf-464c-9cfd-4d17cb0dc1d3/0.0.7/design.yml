      "configuration": {
        "data": {
          "fluent-bit.conf": "[SERVICE]\n    Flush                     5\n    Log_Level                 info\n    storage.path              /var/lib/fluent-bit/storage\n    storage.sync              normal\n    storage.checksum          on\n\n[INPUT]\n    Name                      tail\n    Path                      /var/log/containers/client-app-*.log\n    Tag                       client.app\n    storage.type              filesystem\n    Mem_Buf_Limit             20MB\n    Skip_Long_Lines           On\n\n[FILTER]\n    Name                      modify\n    Match                     client.app\n    Remove                    authorization\n    Remove                    cookie\n    Remove                    password\n    Remove                    request_body\n\n[OUTPUT]\n    Name                      http\n    Match                     client.app\n    Host                      logs.example.com\n    Port                      443\n    URI                       /v1/logs\n    Format                    json_lines\n    tls                       On\n    tls.verify                On\n    Header                    Authorization Bearer ${CLOUD_LOG_TOKEN}\n    storage.total_limit_size  1G\n    Retry_Limit               False\n"
        },
        "metadata": {
          "name": "fluent-bit-config",
          "namespace": "client-platform"
        }
      },
