version: 0.0.7
name: on-prem-kubernetes-with-secure-cloud-logging
displayName: On Prem Kubernetes with Secure Cloud Logging
createdAt: "2026-09-07T07:25:44Z"
description: This design represents a secure on-premises Kubernetes environment for running and automatically scaling a client application. Fluent Bit runs as a DaemonSet and collects application and cluster logs. Network policies use a default-deny approach and permit only the required internal application traffic and outbound log delivery to an authorized cloud logging endpoint. Cloud credentials are referenced through a Kubernetes Secret, while Fluent Bit configuration is stored in a ConfigMap
logoURL: https://raw.githubusercontent.com/meshery/meshery.io/0b8585231c6e2b3251d38f749259360491c9ee6b/assets/images/brand/meshery-logo.svg
