        "primaryColor": "#326CE5",
        "secondaryColor": "#7aa1f0",
        "shape": "round-rectangle",
        "svgColor": "ui/public/static/img/meshmodels/kubernetes/color/deployment-color.svg",
        "svgComplete": "ui/public/static/img/meshmodels/kubernetes/complete/deployment-complete.svg",
        "svgWhite": "ui/public/static/img/meshmodels/kubernetes/white/deployment-white.svg",
        "z-index": 6
      },
      "capabilities": null,
      "status": "enabled",
      "metadata": {
        "configurationUISchema": "",
        "genealogy": "",
        "instanceDetails": null,
        "isAnnotation": false,
        "isNamespaced": true,
        "published": false,
        "source_uri": "git://github.com/kubernetes/kubernetes/master/api/openapi-spec/v3"
      },
      "configuration": {
        "metadata": {
          "labels": {
            "app": "vllm"
          },
          "name": "vllm-server",
          "namespace": "llm-inference"
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app": "vllm"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "vllm"
              }
            },
            "spec": {
              "containers": [
                {
                  "args": [
                    "--model",
                    "$(MODEL_NAME)",
                    "--max-model-len",
                    "$(MAX_MODEL_LEN)",
                    "--port",
                    "8000"
                  ],
                  "env": [
                    {
                      "name": "HF_TOKEN",
                      "valueFrom": {
                        "secretKeyRef": {
                          "key": "HF_TOKEN",
                          "name": "hf-token"
                        }
                      }
                    }
                  ],
                  "envFrom": [
                    {
                      "configMapRef": {
                        "name": "vllm-config"
                      }
                    }
                  ],
                  "image": "vllm/vllm-openai:v0.6.3",
                  "livenessProbe": {
                    "httpGet": {
                      "path": "/health",
                      "port": 8000
                    },
                    "initialDelaySeconds": 120,
                    "periodSeconds": 20
                  },
                  "name": "vllm",
                  "ports": [
                    {
                      "containerPort": 8000,
                      "name": "http"
                    }
                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/health",
                      "port": 8000
                    },
                    "initialDelaySeconds": 60,
                    "periodSeconds": 10
                  },
                  "resources": {
                    "limits": {
                      "cpu": "4",
                      "memory": "16Gi",
                      "nvidia.com/gpu": 1
                    },
                    "requests": {
                      "cpu": "2",
                      "memory": "8Gi",
                      "nvidia.com/gpu": 1
                    }
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/root/.cache/huggingface",
                      "name": "model-cache"
                    },
                    {
                      "mountPath": "/dev/shm",
                      "name": "shm"
                    }
                  ]
                }
              ],
              "volumes": [
                {
                  "name": "model-cache",
                  "persistentVolumeClaim": {
                    "claimName": "model-cache"
                  }
                },
                {
                  "emptyDir": {
                    "medium": "Memory",
                    "sizeLimit": "2Gi"
                  },
                  "name": "shm"
                }
              ]
            }
          }
        }
      },
