version: 0.0.30
name: vllm-inference-server
displayName: vllm-inference-server
createdAt: "2026-11-16T18:40:49Z"
description: |-
    Reference Kubernetes architecture for serving large language models with vLLM's OpenAI-compatible API server.

    Includes:
    - Deployment running vllm/vllm-openai with GPU resource requests, readiness/liveness probes on /health, and shared memory (/dev/shm)
    - Service exposing the OpenAI-compatible API on port 8000, plus an Ingress routing /v1 traffic
    - PersistentVolumeClaim caching Hugging Face model weights so pod restarts don't re-download models
    - ConfigMap for model name and max context length; Secret for the Hugging Face token
    - HorizontalPodAutoscaler scaling replicas 1–3 on CPU utilization
logoURL: https://raw.githubusercontent.com/meshery/meshery.io/0b8585231c6e2b3251d38f749259360491c9ee6b/assets/images/brand/meshery-logo.svg
