readme: "Requires a GPU node pool with the NVIDIA device plugin, a default StorageClass, and an NGINX ingress controller. Pods will not schedule without GPU nodes.\n\nBefore deploying: replace the placeholder HF_TOKEN in the hf-token Secret, set MODEL_NAME in vllm-config (default: Qwen/Qwen2.5-0.5B-Instruct), and adjust GPU/memory requests and PVC size for your model.\n\nCPU-based autoscaling is a simple default; for production, scale on request queue depth or GPU utilization via custom metrics. \n ##h4 Caveats and Consideration \n"
install: mesheryctl design import -f
