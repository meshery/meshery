version: 0.0.2
name: portable-ai-interface-gateway
displayName: Portable Ai Interface gateway
createdAt: "2026-11-09T17:17:14Z"
description: |-
    A Kubernetes-based reference architecture for deploying a portable AI inference gateway. The design provides a centralized entry point for inference requests and routes traffic to an independently managed model-serving backend.

    It includes an Ingress resource for external access, gateway and model-server Deployments, Services for internal communication, and supporting resources for configuration management, identity, security, autoscaling, and availability.

    The architecture demonstrates how AI inference workloads can be organized using Kubernetes-native components while maintaining separation between request routing and model serving. It is intended as a reusable starting point for teams building self-hosted AI inference infrastructure.
