      },
      "configuration": {
        "metadata": {
          "labels": {
            "app": "inference-gateway",
            "app.kubernetes.io/component": "gateway",
            "app.kubernetes.io/name": "inference-gateway",
            "app.kubernetes.io/part-of": "portable-ai-inference"
          },
          "name": "inference-gateway-deployment",
          "namespace": "playground-sandbox"
        },
        "spec": {
          "replicas": 2,
          "selector": {
            "matchLabels": {
              "app": "inference-gateway"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app": "inference-gateway",
                "app.kubernetes.io/component": "gateway",
                "app.kubernetes.io/name": "inference-gateway",
                "app.kubernetes.io/part-of": "portable-ai-inference"
              }
            },
            "spec": {
              "containers": [
                {
                  "envFrom": [
                    {
                      "configMapRef": {
                        "name": "inference-gateway-config"
                      }
                    },
                    {
                      "secretRef": {
                        "name": "inference-gateway-credentials"
                      }
                    }
                  ],
                  "image": "nginxinc/nginx-unprivileged:stable-alpine",
                  "livenessProbe": {
                    "httpGet": {
                      "path": "/healthz",
                      "port": "http"
                    },
                    "initialDelaySeconds": 10,
                    "periodSeconds": 10
                  },
                  "name": "gateway",
                  "ports": [
                    {
                      "containerPort": 8080,
                      "name": "http",
                      "protocol": "TCP"
                    }
                  ],
                  "readinessProbe": {
                    "httpGet": {
                      "path": "/healthz",
                      "port": "http"
                    },
                    "initialDelaySeconds": 3,
                    "periodSeconds": 5
                  },
                  "resources": {
                    "limits": {
                      "cpu": "500m",
                      "memory": "256Mi"
                    },
                    "requests": {
                      "cpu": "100m",
                      "memory": "128Mi"
                    }
                  },
                  "securityContext": {
                    "allowPrivilegeEscalation": false,
                    "capabilities": {
                      "drop": [
                        "ALL"
                      ]
                    },
                    "runAsNonRoot": true
                  },
                  "volumeMounts": [
                    {
                      "mountPath": "/etc/nginx/conf.d/default.conf",
                      "name": "gateway-config",
                      "readOnly": true,
                      "subPath": "default.conf"
                    }
                  ]
                }
              ],
              "serviceAccountName": "inference-service-account",
              "volumes": [
                {
                  "configMap": {
                    "items": [
                      {
                        "key": "default.conf",
                        "path": "default.conf"
                      }
                    ],
                    "name": "inference-gateway-config"
                  },
                  "name": "gateway-config"
                }
              ]
            }
          }
        }
      },
